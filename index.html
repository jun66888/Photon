  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      masterBus = audioCtx.createGain();
      masterBus.gain.value = 0.78;
      masterBus.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    return audioCtx;
  }
  function bus() {
    const ctx = ensureAudio();
    return ctx ? masterBus : null;
  }

  function tone(freq, t0, dur, type, vol, slideTo, attack) {
    const ctx = ensureAudio();
    const out = bus();
    if (!ctx || !out || !sfxEnabled) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    const atk = attack == null ? 0.02 : attack;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(out);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  function noiseBurst(t0, dur, vol, opts = {}) {
    const ctx = ensureAudio();
    const out = bus();
    if (!ctx || !out || !sfxEnabled) return;
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, opts.decay || 1.4);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    const f = ctx.createBiquadFilter();
    f.type = opts.type || "bandpass";
    f.frequency.setValueAtTime(opts.freq || 1800, t0);
    if (opts.freqTo) f.frequency.exponentialRampToValueAtTime(Math.max(40, opts.freqTo), t0 + dur);
    f.Q.value = opts.q || 0.9;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(out);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  /** 仙剑常用五声音阶：宫商角徵羽 */
  const PEN = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25, 783.99, 880.0];

  function playBuffer(buf, vol = 0.85) {
    const ctx = ensureAudio();
    const out = bus();
    if (!ctx || !out || !buf || !sfxEnabled) return false;
    const src = ctx.createBufferSource();
    const g = ctx.createGain();
    src.buffer = buf;
    g.gain.value = vol;
    src.connect(g); g.connect(out);
    src.start();
    return true;
  }

  function openPal3Idb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("gy_arena_pal3_sfx", 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains("samples")) db.createObjectStore("samples");
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function savePal3Sample(key, arrayBuffer) {
    const db = await openPal3Idb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("samples", "readwrite");
      tx.objectStore("samples").put(arrayBuffer, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function loadPal3SamplesFromIdb() {
    try {
      const ctx = ensureAudio();
      if (!ctx) return;
      const db = await openPal3Idb();
      const keys = Object.keys(pal3Samples);
      await Promise.all(keys.map((key) => new Promise((resolve) => {
        const tx = db.transaction("samples", "readonly");
        const req = tx.objectStore("samples").get(key);
        req.onsuccess = async () => {
          const ab = req.result;
          if (ab) {
            try { pal3Samples[key] = await ctx.decodeAudioData(ab.slice(0)); } catch (_) {}
          }
          resolve();
        };
        req.onerror = () => resolve();
      })));
      pal3PackReady = keys.some((k) => !!pal3Samples[k]);
      localStorage.setItem("gy_arena_pal3_pack", pal3PackReady ? "1" : "0");
      updateSfxToggleLabel();
    } catch (_) {}
  }

  function guessSampleKey(name) {
    const n = String(name || "").toLowerCase();
    if (/level|升级|升阶|突破|lvup/.test(n)) return "levelup";
    if (/ultim|超必|大招|绝招|必杀|ultimate|boss|终/.test(n)) return "ultimate";
    if (/heavy|重|强|技能|magic|法术|仙术/.test(n)) return "heavy";
    if (/mid|中|连|combo|任务/.test(n)) return "mid";
    if (/light|轻|小|hit|击|sword|剑/.test(n)) return "light";
    return null;
  }

  async function importPal3SoundPack(fileList) {
    const ctx = ensureAudio();
    if (!ctx) { alert("当前浏览器不支持音频"); return; }
    const files = Array.from(fileList || []).filter((f) => /\.(mp3|wav|ogg|m4a|aac)$/i.test(f.name));
    if (!files.length) {
      alert("请选择 mp3 / wav / ogg 等音效文件。\n建议命名：light / mid / heavy / ultimate / levelup\n（也可含：轻、中、重、大招、升级）");
      return;
    }
    let mapped = 0;
    for (const file of files) {
      const key = guessSampleKey(file.name);
      if (!key) continue;
      const ab = await file.arrayBuffer();
      try {
        pal3Samples[key] = await ctx.decodeAudioData(ab.slice(0));
        await savePal3Sample(key, ab);
        mapped++;
      } catch (_) {}
    }
    if (!mapped && files[0]) {
      const order = ["light", "mid", "heavy", "ultimate", "levelup"];
      for (let i = 0; i < Math.min(files.length, order.length); i++) {
        const ab = await files[i].arrayBuffer();
        try {
          pal3Samples[order[i]] = await ctx.decodeAudioData(ab.slice(0));
          await savePal3Sample(order[i], ab);
          mapped++;
        } catch (_) {}
      }
    }
    pal3PackReady = Object.values(pal3Samples).some(Boolean);
    localStorage.setItem("gy_arena_pal3_pack", pal3PackReady ? "1" : "0");
    updateSfxToggleLabel();
    alert(pal3PackReady
      ? `已导入仙剑音效包（${mapped} 个采样）。加分时优先播放导入音效。`
      : "未能识别音效文件，请按 light/mid/heavy/ultimate/levelup 命名后重试。");
    if (pal3PackReady) playHitSfx(5, "任务");
  }

  /** 剑气破空 —— 仙剑战斗中常见的轻剑音 */
  function pal3SwordWhoosh(t0, bright) {
    noiseBurst(t0, bright ? 0.14 : 0.11, bright ? 0.11 : 0.08, {
      type: "bandpass", freq: bright ? 3400 : 2400, freqTo: bright ? 480 : 360, q: 2.6, decay: 1.8
    });
    tone(bright ? 980 : 720, t0, 0.16, "triangle", 0.055, bright ? 280 : 200, 0.01);
    tone(bright ? 1560 : 1180, t0 + 0.015, 0.2, "sine", 0.045, bright ? 520 : 400, 0.015);
  }

  /** 灵力叮 —— 柔和的仙气确认音 */
  function pal3SpiritChime(t0, noteIdx) {
    const f = PEN[Math.max(0, Math.min(PEN.length - 1, noteIdx))];
    tone(f, t0, 0.42, "sine", 0.09, f * 1.002, 0.01);
    tone(f * 2, t0, 0.32, "triangle", 0.04, f * 2.01, 0.02);
    tone(f * 3, t0 + 0.01, 0.18, "sine", 0.02, f * 3.02, 0.03);
  }

  /** 古琴拨弦感 */
  function pal3QinPluck(t0, f) {
    tone(f, t0, 0.55, "triangle", 0.07, f * 0.995, 0.004);
    tone(f * 2.01, t0, 0.35, "sine", 0.035, f * 2, 0.008);
    tone(f * 0.5, t0, 0.4, "sine", 0.03, f * 0.5, 0.02);
    noiseBurst(t0, 0.04, 0.05, { type: "highpass", freq: 2800, freqTo: 1200, q: 1.2, decay: 2 });
  }

  /** 笛韵短句（大招氛围） */
  function pal3FlutePhrase(t0) {
    const phrase = pick([
      [392, 440, 523, 587],
      [330, 392, 440, 523],
      [440, 523, 587, 659],
      [294, 392, 440, 523]
    ]);
    phrase.forEach((f, i) => {
      tone(f, t0 + i * 0.09, 0.28, "sine", 0.055, f * 1.01, 0.04);
      tone(f * 2, t0 + i * 0.09, 0.2, "triangle", 0.02, f * 2.02, 0.05);
    });
  }

  /** 聚灵充能 */
  function pal3Gather(t0) {
    tone(90, t0, 0.45, "sine", 0.07, 320, 0.08);
    tone(180, t0 + 0.05, 0.4, "triangle", 0.05, 640, 0.1);
    noiseBurst(t0 + 0.06, 0.4, 0.09, { type: "bandpass", freq: 400, freqTo: 2800, q: 1.8, decay: 0.6 });
    [4, 5, 6, 7].forEach((idx, i) => pal3SpiritChime(t0 + 0.08 + i * 0.07, idx));
  }

  /** 轻击：剑气 + 灵力 */
  function pal3Light(t0) {
    pal3SwordWhoosh(t0, false);
    pal3SpiritChime(t0 + 0.04, pick([4, 5, 6]));
    tone(220, t0 + 0.03, 0.12, "sine", 0.05, 110, 0.01);
  }

  /** 中击：连剑 + 琴音 */
  function pal3Mid(t0) {
    pal3SwordWhoosh(t0, true);
    pal3SpiritChime(t0 + 0.03, 5);
    pal3QinPluck(t0 + 0.1, pick([392, 440, 523]));
    pal3SwordWhoosh(t0 + 0.16, false);
    pal3SpiritChime(t0 + 0.2, 7);
  }

  /** 重击：仙术施放 */
  function pal3Heavy(t0) {
    pal3Gather(t0);
    const hit = t0 + 0.22;
    pal3SwordWhoosh(hit, true);
    noiseBurst(hit + 0.02, 0.22, 0.14, { type: "bandpass", freq: 1800, freqTo: 280, q: 1.4, decay: 1.1 });
    tone(160, hit, 0.35, "sine", 0.1, 70, 0.02);
    [523, 659, 784].forEach((f, i) => tone(f, hit + 0.04 + i * 0.06, 0.4, "triangle", 0.07, f * 1.02, 0.02));
    pal3QinPluck(hit + 0.18, 587);
  }

  /** 绝招：御剑 / 天书感 */
  function pal3Ultimate(t0) {
    const style = pick(["jade", "swordrain", "seal", "spirit"]);
    pal3Gather(t0);
    pal3FlutePhrase(t0 + 0.1);
    const hit = t0 + 0.28;
    if (style === "jade") {
      noiseBurst(hit, 0.4, 0.16, { type: "lowpass", freq: 1200, freqTo: 90, decay: 0.75 });
      [523, 659, 784, 1046].forEach((f, i) => {
        tone(f, hit + i * 0.07, 0.55, "sine", 0.08, f * 1.01, 0.03);
        tone(f * 2, hit + i * 0.07, 0.35, "triangle", 0.03, f * 2.02, 0.04);
      });
      pal3SwordWhoosh(hit + 0.15, true);
    } else if (style === "swordrain") {
      [0, 0.07, 0.14, 0.21, 0.3].forEach((d, i) => {
        pal3SwordWhoosh(hit + d, i % 2 === 0);
        pal3SpiritChime(hit + d + 0.02, 5 + (i % 4));
      });
      tone(110, hit + 0.32, 0.45, "sine", 0.12, 45, 0.03);
      noiseBurst(hit + 0.3, 0.35, 0.14, { type: "lowpass", freq: 900, freqTo: 60, decay: 0.8 });
    } else if (style === "seal") {
      pal3QinPluck(hit, 330);
      pal3QinPluck(hit + 0.1, 392);
      pal3QinPluck(hit + 0.2, 523);
      noiseBurst(hit + 0.12, 0.3, 0.12, { type: "bandpass", freq: 700, freqTo: 2200, q: 2, decay: 0.7 });
      tone(880, hit + 0.25, 0.6, "sine", 0.09, 1320, 0.05);
      tone(1760, hit + 0.35, 0.5, "triangle", 0.05, 2200, 0.06);
    } else {
      tone(70, hit, 0.5, "sine", 0.14, 40, 0.04);
      noiseBurst(hit, 0.42, 0.18, { type: "lowpass", freq: 800, freqTo: 55, decay: 0.85 });
      pal3FlutePhrase(hit + 0.05);
      [440, 523, 659, 880].forEach((f, i) => tone(f, hit + 0.2 + i * 0.08, 0.45, "sine", 0.07, f * 1.03, 0.03));
      pal3SwordWhoosh(hit + 0.4, true);
    }
  }

  /** 1=轻剑 2=连招 3=仙术 4=绝招 */
  function powerLevel(points, category) {
    const p = Number(points) || 0;
    if (category === "擂台" || p >= 20) return 4;
    if (p >= 10) return 3;
    if (p >= 5 || category === "任务") return 2;
    return 1;
  }

  function playHitSfx(points, category) {
    const ctx = ensureAudio();
    if (!ctx || !sfxEnabled) return;
    const lv = powerLevel(points, category);
    const sampleKey = lv === 1 ? "light" : lv === 2 ? "mid" : lv === 3 ? "heavy" : "ultimate";
    if (pal3Samples[sampleKey] && playBuffer(pal3Samples[sampleKey], lv >= 3 ? 0.9 : 0.82)) return;
    const now = ctx.currentTime;
    if (lv === 1) return pal3Light(now);
    if (lv === 2) return pal3Mid(now);
    if (lv === 3) return pal3Heavy(now);
    pal3Ultimate(now);
  }

  function playLevelUpSfx() {
    const ctx = ensureAudio();
    if (!ctx || !sfxEnabled) return;
    if (pal3Samples.levelup && playBuffer(pal3Samples.levelup, 0.9)) return;
    const now = ctx.currentTime;
    pal3Gather(now);
    [392, 440, 523, 659, 784, 1046].forEach((f, i) => {
      tone(f, now + 0.1 + i * 0.09, 0.4, "sine", 0.09, f * 1.02, 0.025);
      tone(f * 2, now + 0.1 + i * 0.09, 0.28, "triangle", 0.035, f * 2.02, 0.04);
    });
    pal3QinPluck(now + 0.55, 523);
    tone(1318, now + 0.62, 0.7, "sine", 0.1, 1760, 0.05);
    noiseBurst(now + 0.5, 0.35, 0.1, { type: "bandpass", freq: 2000, freqTo: 600, q: 1.2, decay: 1 });
  }

  function updateSfxToggleLabel() {
    const btn = document.getElementById("sfx-toggle");
    if (!btn) return;
    if (!sfxEnabled) btn.textContent = "🔇 音效关";
    else btn.textContent = pal3PackReady ? "🔊 仙剑音效·包" : "🔊 仙剑音效";
  }

  function clearFxOverlays() {
    const host = document.getElementById("fx-host");
    if (!host) return;
    host.querySelectorAll(".hit-flash, .flash-gold, .ink-burst, .particles, .combo-layer, .toast-levelup").forEach((n) => n.remove());
  }

  function spawnParticles(x, y, color, count, size, opts = {}) {
    const host = document.getElementById("fx-host");
    const layer = document.createElement("div");
    layer.className = "particles";
    const starRatio = opts.starRatio == null ? 0.2 : opts.starRatio;
    const modes = opts.modes || ["dot", "star", "ember", "shard"];
    for (let i = 0; i < count; i++) {
      const p = document.createElement("div");
      const mode = Math.random() < starRatio ? "star" : pick(modes);
      p.className = "particle" + (mode !== "dot" ? " " + mode : "");
      const ang = Math.random() * Math.PI * 2;
      const dist = (opts.dist || 80) + Math.random() * (180 + count * 2);
      const s = (size || 8) * (0.45 + Math.random());
      const dx = Math.cos(ang) * dist;
      const dy = mode === "ember" ? (-40 - Math.random() * 140) : Math.sin(ang) * dist;
      if (mode === "star" || mode === "ring") {
        p.style.cssText = `left:${x}px;top:${y}px;width:${s * 2}px;height:${s * 2}px;--pcolor:${color}`;
      } else if (mode === "shard") {
        p.style.cssText = `left:${x}px;top:${y}px;background:${color};box-shadow:0 0 8px ${color}`;
      } else {
        p.style.cssText = `left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${color};box-shadow:0 0 8px ${color}`;
      }
      p.style.setProperty("--dx", dx + "px");
      p.style.setProperty("--dy", dy + "px");
      p.style.animationDelay = (Math.random() * (opts.stagger || 0.08)) + "s";
      layer.appendChild(p);
    }
    host.appendChild(layer);
    setTimeout(() => layer.remove(), 1300);
  }

  function spawnParticleStorm(cx, cy, lv) {
    const palette = lv >= 4
      ? ["#f0c14b", "#ffe39a", "#ff3b5c", "#fff", "#2ee6ff"]
      : lv >= 3
        ? ["#2ee6ff", "#ff3b5c", "#f0c14b", "#fff"]
        : lv >= 2
          ? ["#2ee6ff", "#f0c14b", "#3dff9a"]
          : ["#3dff9a", "#2ee6ff", "#fff"];
    const n = 28 + lv * 22;
    spawnParticles(cx, cy, pick(palette), n, 5 + lv * 2, { starRatio: 0.25 + lv * 0.08, modes: ["dot", "star", "ember", "shard"] });
    spawnParticles(cx, cy, pick(palette), 8 + lv * 4, 10, { starRatio: 0, modes: ["ring"], dist: 20 });
    if (lv >= 2) {
      let waves = 0;
      const timer = setInterval(() => {
        waves += 1;
        spawnParticles(cx + rand(-40, 40), cy + rand(-30, 30), pick(palette), 10 + lv * 4, 4 + lv, {
          starRatio: 0.35, modes: ["ember", "star", "shard"], stagger: 0.12
        });
        if (waves >= 2 + lv) clearInterval(timer);
      }, 120);
    }
  }

  function spawnSparks(layer, count) {
    for (let i = 0; i < count; i++) {
      const s = document.createElement("div");
      s.className = "hit-spark";
      s.style.left = (35 + Math.random() * 30) + "%";
      s.style.top = (35 + Math.random() * 30) + "%";
      s.style.animationDelay = (Math.random() * 0.12) + "s";
      layer.appendChild(s);
    }
  }
  function inkBurstAt(x, y) {
    const el = document.createElement("div");
    el.className = "ink-burst";
    el.style.left = x + "px"; el.style.top = y + "px";
    document.getElementById("fx-host").appendChild(el);
    setTimeout(() => el.remove(), 700);
  }
  function screenShake(level) {
    const sc = document.getElementById("teacher-screen");
    if (!sc) return;
    sc.classList.remove("screen-shake", "shake-mid", "shake-hard");
    void sc.offsetWidth;
    const cls = level >= 4 ? "shake-hard" : level >= 2 ? "shake-mid" : "";
    sc.classList.add("screen-shake");
    if (cls) sc.classList.add(cls);
    setTimeout(() => sc.classList.remove("screen-shake", "shake-mid", "shake-hard"), level >= 4 ? 750 : 550);
  }
  function tierOf(category, points) {
    const lv = powerLevel(points, category);
    if (lv >= 4) return "arena";
    if (lv >= 2) return "task";
    return "daily";
  }

  function showComboAnnounce(peak, points, reason, category, newScore) {
    const host = document.getElementById("fx-host");
    clearFxOverlays();
    const pts = Number(points) || 0;
    const lv = powerLevel(pts, category);
    const tier = tierOf(category, pts);
    const tags = {
      1: pick(["轻拳", "飞脚", "点穴"]),
      2: pick(["连招", "追击", "破招"]),
      3: pick(["必杀", "剑气", "绝学"]),
      4: pick(["超必杀", "万剑归宗", "巅峰一击"])
    };
    const banners = {
      2: pick(["连击！", "好招！", "中！"]),
      3: pick(["绝学发动！", "剑气纵横！", "SPECIAL!"]),
      4: pick(["☆ 万剑归宗 ☆", "MAX SUPER!", "山河变色！"])
    };

    playHitSfx(pts, category);

    const ringCount = Math.min(2 + lv, 5);
    let rings = "";
    for (let i = 0; i < ringCount; i++) rings += `<div class="combo-ring${i ? " r" + (i + 1) : ""}"></div>`;

    const extras = [];
    if (lv >= 2) extras.push('<div class="speed-lines"></div>');
    if (lv >= 3) {
      extras.push('<div class="rgb-split"></div>');
      extras.push('<div class="wuxia-mist"></div>');
      extras.push('<div class="slash-mark s2" style="--rot:-22deg"></div>');
      extras.push('<div class="slash-mark s3" style="--rot:18deg"></div>');
      extras.push('<div class="impact-burst"></div>');
      extras.push('<div class="wuxia-ribbon r-a"></div><div class="wuxia-ribbon r-b"></div>');
    }
    if (lv >= 4) {
      extras.push('<div class="slash-mark" style="--rot:-8deg;top:46%"></div>');
      extras.push(`<div class="super-banner">${banners[4]}</div>`);
    } else if (lv >= 2) {
      extras.push(`<div class="super-banner">${banners[lv]}</div>`);
    }

    const layer = document.createElement("div");
    layer.className = `combo-layer lv-${lv}`;
    layer.innerHTML = `
      <div class="combo-bg"></div>
      ${extras.join("")}
      ${rings}
      <div class="combo-card tier-${tier} power-${lv}">
        <div class="combo-tag">${tags[lv]} · x${pts}</div>
        <div class="combo-name">${peak.icon || ""} ${esc(peak.name)}</div>
        <div class="combo-points">+${pts}</div>
        <div class="combo-reason">${esc(reason || "加分")}${peak.win_quote && lv >= 3 ? " · " + esc(peak.win_quote) : ""}</div>
        <div class="combo-total">TOTAL SCORE ${newScore ?? peak.score ?? 0} · ${esc(peak.peak_level_name || "")} · ${esc(peak.element || "")}${esc(peak.style || "")}</div>
      </div>`;
    host.appendChild(layer);
    spawnSparks(layer, 4 + lv * 4);

    const floatN = 6 + lv * 5;
    for (let i = 0; i < floatN; i++) {
      const n = document.createElement("div");
      n.className = "float-num";
      n.textContent = `+${pts}`;
      n.style.left = (28 + Math.random() * 44) + "%";
      n.style.top = (34 + Math.random() * 28) + "%";
      n.style.setProperty("--fx", (Math.random() * 140 - 70) + "px");
      n.style.color = lv >= 4 ? "#f0c14b" : lv >= 2 ? "#2ee6ff" : "#3dff9a";
      n.style.fontSize = (1.1 + lv * 0.25) + "rem";
      n.style.animationDelay = (i * 0.03) + "s";
      layer.appendChild(n);
    }

    const cx = innerWidth / 2, cy = innerHeight / 2;
    const hit = document.createElement("div");
    hit.className = "hit-flash" + (lv >= 4 ? " super" : lv >= 3 ? " hard" : "");
    host.appendChild(hit);
    setTimeout(() => { if (hit.parentNode) hit.remove(); }, lv >= 4 ? 480 : lv >= 3 ? 280 : 140);

    spawnParticleStorm(cx, cy, lv);
    if (lv >= 3) {
      inkBurstAt(cx, cy);
      screenShake(lv);
    } else {
      screenShake(lv >= 2 ? lv : 1);
    }
    if (lv >= 4) {
      const flash = document.createElement("div");
      flash.className = "flash-gold";
      host.appendChild(flash);
      setTimeout(() => { if (flash.parentNode) flash.remove(); }, 750);
      setTimeout(() => {
        spawnParticleStorm(cx, cy, 3);
        spawnSparks(layer, 12);
        screenShake(3);
      }, 180);
      setTimeout(() => {
        const ctx2 = ensureAudio();
        if (ctx2 && sfxEnabled) {
          kofStrike(ctx2.currentTime, pick(["punch", "kick"]));
          noiseBurst(ctx2.currentTime, 0.22, 0.18, { type: "lowpass", freq: 900, freqTo: 45 });
        }
        spawnParticleStorm(cx + rand(-20, 20), cy, 4);
        inkBurstAt(cx, cy);
        const burst = document.createElement("div");
        burst.className = "impact-burst";
        layer.appendChild(burst);
        screenShake(4);
      }, 400);
    }

    requestAnimationFrame(() => {
      const el = document.querySelector(`.sect-card[data-peak-id="${peak.id}"]`);
      if (el) {
        el.classList.add("fx-glow");
        const scoreEl = el.querySelector(".sect-score");
        if (scoreEl) {
          scoreEl.classList.remove("flash-green", "flash-blue", "flash-gold");
          void scoreEl.offsetWidth;
          const cls = lv >= 4 ? "flash-gold" : lv >= 2 ? "flash-blue" : "flash-green";
          scoreEl.classList.add(cls);
          setTimeout(() => scoreEl.classList.remove("flash-green", "flash-blue", "flash-gold"), lv >= 4 ? 800 : 650);
        }
        setTimeout(() => el.classList.remove("fx-glow"), 1200);
      }
    });

    const life = lv >= 4 ? 2100 : 1650;
    setTimeout(() => {
      if (layer.parentNode) layer.remove();
      host.querySelectorAll(".hit-flash, .flash-gold, .ink-burst").forEach((n) => n.remove());
    }, life);
  }

  function playScoreAnimation(peakId, points, category) {
    const peak = findPeak(peakId) || { id: peakId, name: "角色", score: 0 };
    showComboAnnounce(peak, points, category, category, peak.score);
  }

  function ensureSfxToggle() {
    if (document.getElementById("sfx-toggle")) return;
    const bar = document.createElement("div");
    bar.className = "sfx-bar";

  function ensureSwordCursorTrail() {
    if (window.__swordCursorBound) return;
    window.__swordCursorBound = true;
    let last = 0;
    document.addEventListener("pointermove", (e) => {
      const now = performance.now();
      if (now - last < 28) return;
      last = now;
      const petal = document.createElement("div");
      petal.className = "cursor-petal";
      petal.style.left = e.clientX + "px";
      petal.style.top = e.clientY + "px";
      petal.style.setProperty("--px", (Math.random() * 24 - 12) + "px");
      petal.style.setProperty("--py", (18 + Math.random() * 28) + "px");

  async function addScoreToPeak(peakId, points, reason, category, opts = {}) {
    const peak = findPeak(peakId);
    if (!peak) { alert("未找到角色"); return null; }
    const pts = Number(points) || 0;
    if (!pts) { alert("分数无效"); return null; }
    const oldLevel = peak.peak_level;
    const newScore = (peak.score || 0) + pts;
    const levelInfo = calcPeakLevel(newScore);
    const day = state.config?.day || 1;
    const updates = {};
    const pk = peakKey(peak.id);
    updates[`peaks/${pk}/score`] = newScore;
    updates[`peaks/${pk}/peak_level`] = levelInfo.peak_level;
    updates[`peaks/${pk}/peak_level_name`] = levelInfo.peak_level_name;
    updates[`peaks/${pk}/progress`] = levelInfo.progress;
    updates[`peaks/${pk}/next_level_score`] = levelInfo.next_level_score;
    const bonusExp = opts.awardBonusExp || 0;
    disciplesOfPeak(peak.id).forEach((d) => {
      const newExp = (d.exp || 0) + pts * 10 + bonusExp;
      const lv = calcPersonalLevel(newExp);
      updates[`disciples/${d.id}/exp`] = newExp;
      updates[`disciples/${d.id}/level`] = lv.level;
      updates[`disciples/${d.id}/title`] = lv.title;
      updates[`disciples/${d.id}/contributed`] = (d.contributed || 0) + pts;
    });
    await updatePaths(updates);
    await pushLog({ timestamp: Date.now(), peak_id: peak.id, peak_name: peak.name, reason: reason || "加分", points: pts, category: category || "日常", operator: OPERATOR, day });
    const leveledUp = levelInfo.peak_level > oldLevel;
    if (!opts.silentFx) {
      const fresh = findPeak(peakId) || { ...peak, score: newScore, peak_level_name: levelInfo.peak_level_name };
      showComboAnnounce(fresh, pts, reason || "加分", category || "日常", newScore);
      if (leveledUp) playLevelUpAnimation(fresh, oldLevel, levelInfo);
    }
    return { newScore, levelInfo, leveledUp, oldLevel, peak: findPeak(peakId) };
  }

  /** 从弹层出招：先关面板，再播特效，避免挡住 */
  async function scoreFromModal(peakId, points, reason, category, awardBonusExp) {
    closeModal();
    await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 60)));
    const result = await addScoreToPeak(peakId, points, reason, category, { awardBonusExp: awardBonusExp || 0, silentFx: true });
    await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 40)));
    const peak = findPeak(peakId);
    if (peak && result) {
      showComboAnnounce(peak, Number(points) || 0, reason || "加分", category || "日常", result.newScore);
      if (result.leveledUp) playLevelUpAnimation(peak, result.oldLevel, result.levelInfo);
    }
    return result;
  }

  function campTotals() {
    let red = 0, blue = 0;
    getPeaksArray().forEach((p) => { if (p.camp === "blue") blue += p.score || 0; else red += p.score || 0; });
    return { red, blue };
  }

  function personalProgress(d) {
    const lv = calcPersonalLevel(d.exp || 0);
    const pct = lv.level >= 30 ? 100 : Math.max(0, Math.min(100, (lv.remainder / (lv.need || 1)) * 100));
    return { ...lv, pct };
  }

  function renderContribPanel(camp, peaks, total) {
    const sorted = peaks.slice().sort((a, b) => (b.score || 0) - (a.score || 0));
    const max = Math.max(...sorted.map((p) => p.score || 0), 1);
    const title = camp === "blue" ? "声浪 · 各组占比" : "光影 · 各组占比";
    if (!sorted.length) return `<div class="contrib-title">${title}</div><div class="muted" style="font-size:.75rem">暂无山峰</div>`;
    return `<div class="contrib-title">${title}</div>` + sorted.map((p) => {
      const score = p.score || 0;
      const share = total > 0 ? (score / total * 100) : 0;
      const depth = 0.32 + 0.68 * (score / max);
      return `<div class="contrib-row" style="opacity:${depth}">
        <div class="cname">${esc(p.icon || "")} ${esc(p.name)}</div>
        <div class="contrib-bar"><i style="width:${share}%;opacity:${0.55 + 0.45 * (score / max)}"></i></div>
        <div class="contrib-meta">${score} · ${share.toFixed(0)}%</div>
      </div>`;
    }).join("");
  }

  function bindPeakListDnD(listEl) {
    listEl.querySelectorAll(".sect-card").forEach((card) => {
      const peakId = String(card.dataset.peakId);
      const handle = card.querySelector("[data-drag-peak]");
      if (handle) {
        handle.addEventListener("dragstart", (e) => {
          dragPeakId = Number(peakId);
          card.classList.add("dragging");
          e.dataTransfer.setData("text/plain", peakId);
          e.dataTransfer.effectAllowed = "move";
          e.stopPropagation();
        });
        handle.addEventListener("dragend", () => {
          card.classList.remove("dragging");
          dragPeakId = null;
          document.querySelectorAll(".camp-col").forEach((c) => c.classList.remove("drag-over"));
        });
      }
      card.addEventListener("click", (e) => {
        if (e.target.closest("button") || e.target.closest("[data-member-row]") || e.target.closest(".drag-handle")) return;
        openSectModal(Number(peakId), "bonus");
      });
      const btn = card.querySelector("[data-open-sect]");
      if (btn) btn.addEventListener("click", (e) => {
        e.stopPropagation();
        openSectModal(Number(btn.dataset.openSect), "bonus");
      });
      const tog = card.querySelector("[data-toggle-members]");
      const box = card.querySelector(".member-bars");
      if (tog && box) {
        tog.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const open = !box.classList.contains("open");
          box.classList.toggle("open", open);
          if (open) expandedPeaks.add(peakId); else expandedPeaks.delete(peakId);
          const n = box.querySelectorAll("[data-member-row]").length;
          tog.textContent = open ? `组员 ${n} ▴ 收起` : `组员 ${n} ▾ 展开`;
        });
      }
      card.querySelectorAll("[data-member-row]").forEach((row) => {
        const mid = row.dataset.memberRow;
        if (expandedMembers.has(mid)) row.classList.add("open");
        row.addEventListener("click", (e) => {
          e.stopPropagation();
          const open = row.classList.toggle("open");
          if (open) expandedMembers.add(mid); else expandedMembers.delete(mid);
        });
      });
    });
  }

  function setupCampDropZones() {
    document.querySelectorAll(".camp-col").forEach((col) => {
      col.ondragover = (e) => { e.preventDefault(); col.classList.add("drag-over"); };
      col.ondragleave = () => col.classList.remove("drag-over");
      col.ondrop = async (e) => {
        e.preventDefault();
        e.stopPropagation();
        col.classList.remove("drag-over");
        const id = Number(e.dataTransfer.getData("text/plain") || dragPeakId);
        const camp = col.dataset.camp;
        if (!id && id !== 0) return;
        await movePeakToCamp(id, camp, e.target.closest(".sect-card"));
      };
    });
    document.querySelectorAll(".peak-list").forEach((list) => {
      list.ondragover = (e) => { e.preventDefault(); e.stopPropagation(); };
      list.ondrop = async (e) => {
        e.preventDefault();
        e.stopPropagation();
        const id = Number(e.dataTransfer.getData("text/plain") || dragPeakId);
        const camp = list.dataset.camp;
        const over = e.target.closest(".sect-card");
        await movePeakToCamp(id, camp, over);
      };
    });
  }

  async function movePeakToCamp(peakId, camp, overCard) {
    const peak = findPeak(peakId);
    if (!peak) return;
    const updates = {};
    updates[`peaks/${peakKey(peakId)}/camp`] = camp;
    disciplesOfPeak(peakId).forEach((d) => { updates[`disciples/${d.id}/camp`] = camp; });
    // reorder
    const siblings = sortPeaks(getPeaksArray().filter((p) => p.camp === camp && p.id !== peakId));
    let insertAt = siblings.length;
    if (overCard) {
      const overId = Number(overCard.dataset.peakId);
      insertAt = siblings.findIndex((p) => p.id === overId);
      if (insertAt < 0) insertAt = siblings.length;
    }
    siblings.splice(insertAt, 0, { ...peak, camp });
    siblings.forEach((p, i) => { updates[`peaks/${peakKey(p.id)}/sort_order`] = i; });
    // other camp keep relative
    const others = sortPeaks(getPeaksArray().filter((p) => p.camp !== camp && p.id !== peakId));
    others.forEach((p, i) => { updates[`peaks/${peakKey(p.id)}/sort_order`] = i; });
    await updatePaths(updates);
    spawnParticles(innerWidth/2, 180, camp === "red" ? "#e8a0a8" : "#7ed9cb", 22, 6);
  }

  function applyArenaDensity(redCount, blueCount) {
    const board = document.querySelector(".camps-board");
    const hud = document.getElementById("pk-bar");
    const main = document.getElementById("teacher-main");
    if (!board) return;
    const maxCamp = Math.max(redCount, blueCount, 1);
    const total = Math.max(redCount + blueCount, 1);
    // 队伍少放大、队伍多缩小（约 1.45 → 0.62）
    const scale = Math.max(0.62, Math.min(1.45, 1.55 / Math.sqrt(maxCamp)));
    const hudScale = Math.max(0.78, Math.min(1.15, 1.2 / Math.sqrt(Math.max(total / 2, 1))));
    board.style.setProperty("--arena-scale", String(Number(scale.toFixed(3))));
    board.dataset.density = String(Math.min(8, maxCamp));
    board.style.setProperty("--camp-count", String(maxCamp));
    if (hud) {
      hud.style.setProperty("--hud-scale", String(Number(hudScale.toFixed(3))));
      hud.dataset.teams = String(Math.min(8, maxCamp));
    }
    // 均分列高：让 camps-board 吃满剩余视口
    if (main && teacherView === "main") {
      const top = board.getBoundingClientRect().top;
      const bottomPad = 36; // ticker
      const h = Math.max(220, window.innerHeight - top - bottomPad);
      board.style.height = h + "px";
    }
  }

  function esc(s) {
    return String(s ?? "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  }

  async function quickAddDisciple(peakId) {
    const name = prompt("弟子姓名（2-4字）", "");
    if (!name || !/^[\u4e00-\u9fa5]{2,4}$/.test(name)) { if (name !== null) alert("请输入2-4个中文名"); return; }
    const peak = findPeak(peakId);
    const id = "disciple_" + Date.now();
    const lv = calcPersonalLevel(0);
    await setPath("disciples/" + id, {
      name, student_id: "", peak: peakId, camp: peak.camp, exp: 0, level: lv.level, title: lv.title,
      rank: "青铜", role: "弟子", voted: false, contributed: 0,
      checked_in_am: false, checked_in_pm: false, first_seen: "", voted_for: "", weapon: "笔"
    });
    openSectModal(peakId, "members");
  }

  async function addPeak(camp) {
    const ids = getPeaksArray().map((p) => p.id);
    const id = ids.length ? Math.max(...ids) + 1 : 0;
    const name = prompt("新门派名称", camp === "blue" ? "新声门" : "新影门");
    if (!name) return;
    const order = getPeaksArray().filter((p) => p.camp === camp).length;
    await setPath("peaks/" + peakKey(id), makePeak({
      id, name, icon: camp === "blue" ? "🌊" : "🐉", camp, slogan: "新门出山",
      captain_name: "", art: "待授绝学", base: "新驻地", intro: "初入江湖的门派", sort_order: order
    }));
  }

  function setTeacherView(view) {
    teacherView = view;
    ["main", "checkin", "vote", "logs", "settings"].forEach((v) => {
      const id = v === "main" ? "teacher-main" : "teacher-" + v;
      const el = document.getElementById(id);
      if (el) el.classList.toggle("hidden", v !== view);

  function randCode() { return String(Math.floor(100000 + Math.random() * 900000)); }
  function publicPageUrl(query) {
    return `${location.origin}${location.pathname}${query.startsWith("?") ? query : "?" + query}`;
  }
  function renderQr(host, url, size) {
    if (!host) return;
    host.innerHTML = "";
    host.style.textAlign = "center";
    const box = document.createElement("div");
    box.style.cssText = `display:inline-block;padding:8px;background:#fff;border-radius:6px`;
    host.appendChild(box);
    let ok = false;
    if (typeof QRCode !== "undefined") {
      try {
        // qrcodejs API
        // eslint-disable-next-line no-new
        new QRCode(box, {
          text: url,
          width: size || 180,
          height: size || 180,
          colorDark: "#111111",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel ? QRCode.CorrectLevel.M : 1
        });
        ok = true;
      } catch (err) {
        console.warn("QR render failed", err);
      }
    }
    const link = document.createElement("a");
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = ok ? "扫码或点此打开" : url;
    link.style.cssText = "display:block;margin-top:8px;font-size:12px;word-break:break-all;color:#333";
    host.appendChild(link);
    if (demoMode) {
      const warn = document.createElement("div");
      warn.className = "demo-qr-warn";
      warn.textContent = "DEMO 模式：手机扫码需与投屏同一浏览器数据源；多设备请配置 Firebase。当前链接：" + location.origin;
      host.appendChild(warn);
    }
    if (!ok) {
      const tip = document.createElement("div");
      tip.style.cssText = "margin-top:6px;font-size:12px;color:#a33";
      tip.textContent = "二维码库未加载，请用上方链接打开";
      host.appendChild(tip);
    }
  }
  /** 微信签到：结束签到前长期有效，可手动刷新换码 */
  const CHECKIN_TTL_MS = 12 * 60 * 60 * 1000;
  async function generateCheckinCode() {
    await updatePaths({
      "config/checkin_code": randCode(),
      "config/checkin_expires_at": Date.now() + CHECKIN_TTL_MS,
      "config/checkin_active": true
    });
    startCheckinRefreshLoop();
    renderTeacherCheckin();
  }
  async function refreshCheckinCode() {
    if (!state.config?.checkin_active) {
      await generateCheckinCode();
      return;
    }
    await updatePaths({
      "config/checkin_code": randCode(),
      "config/checkin_expires_at": Date.now() + CHECKIN_TTL_MS
    });
    renderTeacherCheckin();
  }
  function startCheckinRefreshLoop() {
    if (checkinRefreshTimer) clearInterval(checkinRefreshTimer);
    checkinRefreshTimer = setInterval(() => {
      if (teacherView !== "checkin") return;
      const cd = document.getElementById("checkin-countdown");
      if (!cd) return;
      if (!state.config?.checkin_active) { cd.textContent = "未开启"; return; }
      cd.textContent = "扫码签到中 · 点「结束签到」关闭";
    }, 1000);
  }
  function renderTeacherCheckin() {
    const session = state.config?.checkin_session || "am";
    document.getElementById("checkin-session-label").textContent = session === "pm" ? "下午" : "上午";
    const flag = session === "pm" ? "checked_in_pm" : "checked_in_am";
    const timeFlag = session === "pm" ? "checked_in_pm_at" : "checked_in_am_at";
    const disciples = sortDisciples(getDisciplesArray(), "name");
    const checked = disciples.filter((d) => d[flag]);
    const unchecked = disciples.filter((d) => !d[flag]);
    document.getElementById("checkin-count").textContent = checked.length;
    document.getElementById("checkin-total").textContent = disciples.length;
    document.getElementById("checkin-progress").style.width = (disciples.length ? checked.length / disciples.length * 100 : 0) + "%";
    document.getElementById("checked-list").innerHTML = checked.map((d) =>
      `<span class="name-chip ok">${d.student_id || "---"} ${d.name}${d[timeFlag] ? " · " + fmtTime(d[timeFlag]) : ""}</span>`
    ).join("") || '<span class="muted">暂无</span>';
    document.getElementById("unchecked-list").innerHTML = unchecked.map((d) =>
      `<span class="name-chip miss">${d.student_id || "未注册"} ${d.name}</span>`
    ).join("") || '<span class="muted">全员已签</span>';
    const code = state.config?.checkin_code || "------";
    document.getElementById("checkin-code-text").textContent = code;
    document.getElementById("checkin-countdown").textContent = state.config?.checkin_active
      ? "扫码签到中 · 点「结束签到」关闭"
      : "未开启";
    const qrHost = document.getElementById("checkin-qr");
    if (state.config?.checkin_active && code !== "------") {
      renderQr(qrHost, publicPageUrl(`?mode=checkin&code=${code}`), 200);
    } else {
      qrHost.innerHTML = '<div class="muted" style="padding:2rem;color:#333">点击「生成微信签到码」投屏</div>';
    }
  }

  function renderTeacherVote() {
    document.getElementById("vote-title").textContent = state.config?.title || "投票";

    const totalVotes = getPeaksArray().reduce((s, p) => s + (p.votes || 0), 0);

    renderQr(document.getElementById("student-vote-qr"), publicPageUrl("?mode=student"), 160);

  function exportCSV() {
    const header = "timestamp,day,peak_name,points,reason,category,operator\n";
    const rows = getLogsArray().map((l) => [l.timestamp,l.day,csvEsc(l.peak_name),l.points,csvEsc(l.reason),csvEsc(l.category),csvEsc(l.operator)].join(",")).join("\n");

  function csvEsc(s) { const t = String(s ?? ""); return /[",\n]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; }
  function downloadBlob(filename, content, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([content], { type }));
    a.download = filename; a.click(); URL.revokeObjectURL(a.href);
  }
  async function changeDay(newDay) {
    const day = Math.max(1, Number(newDay) || 1);
    const updates = { "config/day": day, "config/week": Math.ceil(day / 7) };
    getPeaksArray().forEach((p) => { updates[`peaks/${peakKey(p.id)}/votes`] = 0; });
    getDisciplesArray().forEach((d) => {
      updates[`disciples/${d.id}/checked_in_am`] = false;
      updates[`disciples/${d.id}/checked_in_pm`] = false;
      updates[`disciples/${d.id}/checked_in_am_at`] = 0;
      updates[`disciples/${d.id}/checked_in_pm_at`] = 0;
      updates[`disciples/${d.id}/voted`] = false;
      updates[`disciples/${d.id}/voted_for`] = "";
    });
    localStorage.removeItem(LS_VOTE_KEY);
    await updatePaths(updates);
  }
  async function doSettleRanks() {
    const ranks = settleRanks(state.disciples || {});
    const updates = {};
    Object.entries(ranks).forEach(([id, rank]) => { updates[`disciples/${id}/rank`] = rank; });
    await updatePaths(updates);

      return { id: local.disciple_id, ...state.disciples[local.disciple_id] };
    }
    return getDisciplesArray().find((d) =>
      (local.student_id && d.student_id === local.student_id) ||

  async function confirmStudentVote(peakId) {
    const me = findDiscipleByLocal();
    if (!me) { alert("请先绑定身份"); openStudentPickModal(); return; }
    if (!(state.config && state.config.voting_open)) { alert("投票已关闭"); return; }
    if (me.voted || localStorage.getItem(LS_VOTE_KEY)) { alert("本轮已投过票"); renderStudent(); return; }
    const peak = findPeak(peakId);
    if (!peak) return;
    if (!confirm(`确认投票给 ${peak.icon} ${peak.name}？`)) return;
    await updatePaths({
      [`peaks/${peakKey(peakId)}/votes`]: (peak.votes || 0) + 1,
      [`disciples/${me.id}/voted`]: true,
      [`disciples/${me.id}/voted_for`]: peak.name
    });
    localStorage.setItem(LS_VOTE_KEY, peak.name);
    const burst = document.createElement("div");
    burst.className = "toast-levelup";
    burst.innerHTML = `<div class="msg">✅ 投票成功<br/><span style="font-size:.7em">${peak.icon} ${esc(peak.name)}</span></div>`;
    document.getElementById("fx-host").appendChild(burst);
    setTimeout(() => burst.remove(), 1600);
    playHitSfx(5, "任务");
    renderStudent();
  }

  async function nextStudentId() {
    const ids = getDisciplesArray().map((d) => parseInt(d.student_id, 10)).filter((n) => !isNaN(n));
    return String((ids.length ? Math.max(...ids) : 0) + 1).padStart(3, "0");

  function checkinFlag() {
    return (state.config?.checkin_session || "am") === "pm" ? "checked_in_pm" : "checked_in_am";
  }
  function checkinTimeFlag() {
    return (state.config?.checkin_session || "am") === "pm" ? "checked_in_pm_at" : "checked_in_am_at";
  }
  function isCodeValid(code) {
    const cfg = state.config || {};
    // 结束签到前码始终有效（过期时间仅作提示，不拦截）
    return !!(cfg.checkin_active && cfg.checkin_code && code && cfg.checkin_code === code);
  }
  function codeOk(code) { return isCodeValid(code); }
  async function applyCheckin(discipleId) {
    const d = state.disciples[discipleId];
    if (!d) return { ok: false, msg: "未找到学员" };
    const flag = checkinFlag();
    const timeFlag = checkinTimeFlag();
    if (d[flag]) {
      return { ok: false, msg: `本时段已签到 ✓ ${d[timeFlag] ? fmtTime(d[timeFlag]) : ""}`, already: true, at: d[timeFlag] };
    }
    const now = Date.now();
    await updatePaths({
      [`disciples/${discipleId}/${flag}`]: true,
      [`disciples/${discipleId}/${timeFlag}`]: now
    });
    if (d.peak >= 0) await addScoreToPeak(d.peak, 2, "签到", "日常");
    return { ok: true, at: now };
  }

    const body = document.getElementById("checkin-body");

    const sessionLabel = (state.config?.checkin_session || "am") === "pm" ? "下午" : "上午";

    }

    const selected = checkinNameSelected;
    body.innerHTML = `
      <div class="stack">
        <p class="muted" style="text-align:center">微信已记住你，请确认身份</p>
        <button type="button" id="ci-name-card" style="width:100%;padding:1.1rem;text-align:left;border:2px solid ${selected ? "var(--seal)" : "var(--frame)"};background:${selected ? "rgba(163,32,32,.08)" : "#fff8e7"}">
          <div style="font-family:var(--font-brush);font-size:1.9rem;color:var(--seal)">${esc(local.name)}</div>
          <div class="muted">学号 ${esc(local.student_id)} · 点击选择我</div>
        </button>
        <button type="button" class="primary" id="ci-do" style="padding:1rem;font-size:1.25rem;width:100%" ${selected ? "" : "disabled"}>签到</button>

      renderCheckinIdentityStep(code, local, me);
    };

      if (!checkinNameSelected) { alert("请先点击上面的名字确认是本人"); return; }
      if (!codeOk(code)) { alert("签到已结束或二维码已失效，请重新扫老师投屏码"); renderCheckin(); return; }
      const disciple = findDiscipleByLocal();
      if (!disciple) { localStorage.removeItem(LS_STUDENT_KEY); checkinNameSelected = false; renderCheckin(); return; }
      const res = await applyCheckin(disciple.id);
      renderCheckinSuccess(local.name, local.student_id, res.at || Date.now(), !!res.already);

  function renderCheckin() {
    const { code } = getMode();
    const body = document.getElementById("checkin-body");
    const sessionLabel = (state.config?.checkin_session || "am") === "pm" ? "下午" : "上午";
    const hint = document.getElementById("checkin-session-hint");

      body.innerHTML = `
        <div style="text-align:center;padding:1rem" class="stack">

  async function registerAndCheckin(code) {
    const name = (document.getElementById("ci-name").value || "").trim();
    if (!/^[\u4e00-\u9fa5]{2,4}$/.test(name)) { alert("请输入2-4个中文名"); return; }
    if (!codeOk(code)) { alert("签到码无效，请重新扫码"); return; }

    const sameNameRegistered = getDisciplesArray().find((d) => d.name === name && d.student_id);
    if (sameNameRegistered) {
      alert("这个名字已经登记过学号了，请在名单里点自己的名字");
      showWhoList(code, name);
      return;
    }

    let existing = getDisciplesArray().find((d) => d.name === name && !d.student_id);
    let discipleId, student_id;
    if (existing) {
      discipleId = existing.id;
      student_id = await nextStudentId();
      await updatePaths({
        [`disciples/${discipleId}/student_id`]: student_id,
        [`disciples/${discipleId}/first_seen`]: new Date().toISOString(),
        [`disciples/${discipleId}/name`]: name
      });
    } else {
      const peaks = getPeaksArray();
      const counts = {};
      peaks.forEach((p) => { counts[p.id] = 0; });
      getDisciplesArray().forEach((d) => { counts[d.peak] = (counts[d.peak] || 0) + 1; });
      const target = peaks.slice().sort((a, b) => (counts[a.id] || 0) - (counts[b.id] || 0))[0] || { id: 0, camp: "red" };
      student_id = await nextStudentId();
      discipleId = "disciple_" + Date.now();
      const lv = calcPersonalLevel(0);
      await setPath("disciples/" + discipleId, {
        name, student_id, peak: target.id, camp: target.camp,
        exp: 0, level: lv.level, title: lv.title, rank: "青铜", role: "弟子",
        voted: false, contributed: 0, checked_in_am: false, checked_in_pm: false,
        checked_in_am_at: 0, checked_in_pm_at: 0,
        first_seen: new Date().toISOString(), voted_for: "", weapon: "笔"
      });
    }

    setLocalStudent({ student_id, name, disciple_id: discipleId });
    checkinNameSelected = true;
    const me = { id: discipleId, ...(state.disciples[discipleId] || {}), name, student_id };
    renderCheckinIdentityStep(code, { name, student_id }, me);
  }

      <div class="stack" style="max-height:55vh;overflow:auto">
        ${list.map((d) => {
          const hi = highlightName && d.name === highlightName;
          return `<button type="button" data-who="${d.id}" style="text-align:left;padding:.85rem;${hi ? "border-color:var(--seal);background:rgba(163,32,32,.08)" : ""}">
            <div style="font-size:1.2rem;font-weight:700">${esc(d.name)}</div>
            <div class="muted">学号 ${esc(d.student_id)}</div>
          </button>`;
        }).join("") || '<div class="muted">还没有人登记，请先输入姓名</div>'}
      </div>
      <button type="button" class="ghost" id="ci-back" style="margin-top:.8rem;width:100%">返回</button>`;

    document.getElementById("ci-back").onclick = () => { checkinNameSelected = false; renderCheckin(); };
    body.querySelectorAll("[data-who]").forEach((btn) => {
      btn.onclick = () => {
        const id = btn.dataset.who;
        const d = state.disciples[id];
        if (!d) return;
        setLocalStudent({ student_id: d.student_id, name: d.name, disciple_id: id });
        checkinNameSelected = true;
        renderCheckinIdentityStep(code, { name: d.name, student_id: d.student_id }, { id, ...d });
      };
    });
  }

  /* memories (compact) */
  const memState = { media: [], mode: 0, playing: false, speed: 1, dayKeys: [], dayIndex: 0, timer: null, bgmOn: true, caption: "20天·25个人·1个联盟", _byDay: null, interval: null };
  function onMemoriesFolder(fileList) {
    const media = [];
    Array.from(fileList || []).forEach((f) => {
      const lower = f.name.toLowerCase();
      const isImg = /\.(jpg|jpeg|png|gif|webp)$/.test(lower) || (f.type||"").startsWith("image/");
      const isVid = /\.(mp4|mov|webm)$/.test(lower) || (f.type||"").startsWith("video/");
      if (!isImg && !isVid) return;
      media.push({ file: f, url: URL.createObjectURL(f), type: isVid ? "video" : "image", t: f.lastModified || 0 });
    });
    media.sort((a,b)=>a.t-b.t);
    memState.media = media;
    const days = new Map();
    media.forEach((m) => {
      const d = new Date(m.t); const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      if (!days.has(key)) days.set(key, []); days.get(key).push(m);
    });
    memState.dayKeys = Array.from(days.keys()); memState._byDay = days;
    const imgs = media.filter((m)=>m.type==="image").length, vids = media.length - imgs;
    let range = "";
    if (media.length) { const a=new Date(media[0].t), b=new Date(media[media.length-1].t); range=`${a.getMonth()+1}月${a.getDate()}日→${b.getMonth()+1}月${b.getDate()}日`; }
    document.getElementById("memories-load-status").textContent = `已加载${imgs}张照片+${vids}段视频` + (range ? "·"+range : "");
    if (media.length) setTimeout(() => startMemoriesPlayback(), 500);
  }
  function startMemoriesPlayback() {
    memState.caption = document.getElementById("memories-caption").value || memState.caption;
    document.getElementById("memories-loader").classList.add("hidden");
    document.getElementById("memories-stage").classList.remove("hidden");
    document.getElementById("memories-controls").classList.remove("hidden");
    memState.playing = true; runMemoryMode();
    try {
      if (!window.__arenaAudioCtx) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        window.__arenaAudioCtx = ctx;
        const master = ctx.createGain(); master.gain.value = 0.04; master.connect(ctx.destination);
        const osc = ctx.createOscillator(), osc2 = ctx.createOscillator();
        osc.type = "sine"; osc2.type = "sine"; osc.frequency.value = 220; osc2.frequency.value = 277;
        const g = ctx.createGain(); g.gain.value = 0.6; osc.connect(g); osc2.connect(g); g.connect(master);
        osc.start(); osc2.start(); window.__arenaPad = { master, ctx };
      }
    } catch (e) {}
  }
  function clearMemTimer() { if (memState.timer) clearTimeout(memState.timer); memState.timer = null; }
  function runMemoryMode() {
    clearMemTimer();
    const stage = document.getElementById("memories-stage");
    const ruler = document.getElementById("memories-ruler");
    stage.innerHTML = ""; ruler.classList.add("hidden");
    if (!memState.media.length) return;
    if (memState.mode === 0) playTimeline(stage, ruler);
    else if (memState.mode === 1) playWaterfall(stage);
    else playFlashback(stage);
  }
  function playTimeline(stage, ruler) {
    ruler.classList.remove("hidden");
    const track = document.createElement("div"); track.className = "timeline-track";
    memState.media.forEach((m) => {
      const item = document.createElement("div"); item.className = "timeline-item";
      if (m.type === "image") { const img = document.createElement("img"); img.src = m.url; item.appendChild(img); }
      else { const v = document.createElement("video"); v.src = m.url; v.muted = true; v.playsInline = true; item.appendChild(v); }
      track.appendChild(item);
    });
    stage.appendChild(track);
    ruler.innerHTML = memState.dayKeys.map((k) => `<span>${k.slice(5)}</span>`).join("");
    let idx = 0; const stepMs = 2000 / memState.speed;
    const tick = () => {
      if (!memState.playing) return;
      const els = track.querySelectorAll(".timeline-item"); if (!els.length) return;
      els.forEach((el) => el.classList.remove("active"));
      const cur = els[idx % els.length]; cur.classList.add("active");
      const mediaEl = cur.querySelector("video"); if (mediaEl) { mediaEl.currentTime = 0; mediaEl.play().catch(()=>{}); }
      track.style.transition = `transform ${0.8/memState.speed}s ease`;
      track.style.transform = `translateX(${-(cur.offsetLeft - stage.clientWidth * 0.3)}px)`;
      idx += 1;
      memState.timer = setTimeout(idx >= els.length ? () => playEnding(stage) : tick, stepMs);
    };
    tick();
  }
  function playWaterfall(stage) {
    const layer = document.createElement("div"); layer.className = "waterfall-layer"; stage.appendChild(layer);
    let i = 0;
    const spawn = () => {
      if (!memState.playing || i >= memState.media.length) { memState.timer = setTimeout(() => playEnding(stage), 1000); return; }
      const m = memState.media[i++]; const age = i / memState.media.length; const size = 80 + age * 160;
      const el = document.createElement("div"); el.className = "waterfall-item";
      el.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*80+5}%;filter:${age<0.35?"grayscale(.45) brightness(.85)":"none"};animation-duration:${(4+Math.random()*3)/memState.speed}s`;
      el.style.setProperty("--rot", (Math.random()*20-10)+"deg");
      if (m.type==="image") { const img=document.createElement("img"); img.src=m.url; el.appendChild(img); }
      else { const v=document.createElement("video"); v.src=m.url; v.muted=true; v.autoplay=true; el.appendChild(v); }
      layer.appendChild(el); setTimeout(()=>el.remove(), 7000/memState.speed);
      memState.timer = setTimeout(spawn, 350/memState.speed);
    };
    spawn();
  }
  function playFlashback(stage) {
    let i = 0; const frame = document.createElement("div"); frame.className = "flashback-frame"; stage.appendChild(frame);
    const show = () => {
      if (!memState.playing) return;
      if (i >= memState.media.length) { playEnding(stage); return; }
      const m = memState.media[i++]; frame.innerHTML = "";
      memState.timer = setTimeout(() => {
        if (m.type==="image") { const img=document.createElement("img"); img.src=m.url; frame.appendChild(img); }
        else { const v=document.createElement("video"); v.src=m.url; v.muted=true; v.autoplay=true; frame.appendChild(v); }
        const hold = Math.max(120, 500 - i * 8) / memState.speed;
        memState.timer = setTimeout(() => { frame.innerHTML=""; memState.timer=setTimeout(show, 80/memState.speed); }, hold);
      }, 80/memState.speed);
    };
    show();
  }
  function playEnding(stage) {
    clearMemTimer();
    const media = memState.media.filter((m)=>m.type==="image");
    const hero = media.length ? media[media.length-1] : memState.media[memState.media.length-1];
    stage.innerHTML = ""; document.getElementById("memories-ruler").classList.add("hidden");
    const gridWrap = document.createElement("div"); gridWrap.className = "ending-grid";
    const mosaic = document.createElement("div"); mosaic.className = "mosaic";
    (media.length?media:memState.media).slice(-32).forEach((m) => { const img=document.createElement("img"); img.src=m.type==="image"?m.url:""; mosaic.appendChild(img); });
    gridWrap.appendChild(mosaic); stage.appendChild(gridWrap);
    setTimeout(() => {
      stage.innerHTML = "";
      const heroWrap = document.createElement("div"); heroWrap.className = "ending-hero";
      const img = document.createElement("img"); img.src = hero.url; heroWrap.appendChild(img);
      const text = document.createElement("div"); text.className = "ending-text"; text.textContent = memState.caption; heroWrap.appendChild(text);
      stage.appendChild(heroWrap); requestAnimationFrame(() => img.classList.add("sharp"));
      setTimeout(() => text.classList.add("show"), 800);
      try { if (window.__arenaPad) window.__arenaPad.master.gain.linearRampToValueAtTime(0, window.__arenaAudioCtx.currentTime + 4); } catch(e){}
      memState.playing = false;
    }, 1600/memState.speed);
  }
  function memControl(action) {
    if (action === "exit") { clearMemTimer(); location.href = location.pathname + "?mode=teacher"; return; }
    if (action === "mode") { memState.mode = (memState.mode+1)%3; memState.playing = true; runMemoryMode(); return; }
    if (action === "toggle") { memState.playing = !memState.playing; if (memState.playing) runMemoryMode(); else clearMemTimer(); return; }
    if (action === "speed") { memState.speed = memState.speed===1?2:memState.speed===2?3:1; const btn=document.querySelector('[data-mem="speed"]'); if(btn) btn.textContent=`速度 ${memState.speed}x`; if(memState.playing) runMemoryMode(); return; }
    if (action === "bgm") { memState.bgmOn = !memState.bgmOn; try { if (window.__arenaPad) window.__arenaPad.master.gain.value = memState.bgmOn ? 0.04 : 0; } catch(e){} return; }
    if (action === "prev" || action === "next") {
      if (!memState.dayKeys.length) return;
      memState.dayIndex = action==="next" ? Math.min(memState.dayKeys.length-1, memState.dayIndex+1) : Math.max(0, memState.dayIndex-1);
      const dayMedia = memState._byDay.get(memState.dayKeys[memState.dayIndex]) || [];
      const backup = memState.media; memState.media = dayMedia.length ? dayMedia : backup; memState.playing = true; runMemoryMode(); setTimeout(()=>{ memState.media = backup; }, 50);
    }
  }

  function renderAll() {
    // migrate old peaks missing new fields
    getPeaksArray().forEach((p) => {
      if (p.art == null) p.art = "未传绝学";
      if (p.base == null) p.base = "未定驻地";
      if (p.intro == null) p.intro = "";
      if (p.captain_name == null) p.captain_name = "";
      if (p.logo_url == null) p.logo_url = "";
      if (p.element == null) p.element = "光";
      if (p.style == null) p.style = "剑";
      if (p.win_quote == null) p.win_quote = "此局，我方胜！";
      if (p.badge == null) p.badge = "新锐";
      if (p.sort_order == null) p.sort_order = p.id;
    });
    getDisciplesArray().forEach((d) => {
      if (!d.role) d.role = "弟子";
      if (!d.weapon) d.weapon = "笔";
    });
    const { mode } = getMode();
    if (mode === "teacher") {
      if (teacherView === "main") renderTeacherMain();
      else if (teacherView === "checkin") renderTeacherCheckin();
      else if (teacherView === "vote") renderTeacherVote();
      else if (teacherView === "logs") renderLogs();
      else if (teacherView === "settings") renderSettings();
    } else if (mode === "student") renderStudent();
    else if (mode === "checkin") renderCheckin();
  }

  async function handleTeacherAction(act, btn) {
    if (act === "back-main" || act === "goto-main" || act === "go-home") { goHome(); return; }
    if (act === "toggle-contrib") {
      const strip = document.getElementById("contrib-strip");
      const tbtn = document.getElementById("btn-toggle-contrib");
      if (strip) {
        const open = strip.classList.toggle("hidden") === false;
        if (tbtn) tbtn.textContent = open ? "贡献 ▴" : "贡献 ▾";
        const redN = document.querySelectorAll("#list-red .sect-card").length;
        const blueN = document.querySelectorAll("#list-blue .sect-card").length;
        applyArenaDensity(redN, blueN);
      }
      return;
    }
    if (act === "custom-score") { openCustomScoreModal(); return; }
    if (act === "goto-checkin") { showScreen("teacher"); setTeacherView("checkin"); startCheckinRefreshLoop(); return; }
    if (act === "goto-vote") { showScreen("teacher"); setTeacherView("vote"); return; }
    if (act === "goto-logs") { showScreen("teacher"); setTeacherView("logs"); return; }
    if (act === "goto-settings") { showScreen("teacher"); setTeacherView("settings"); return; }
    if (act === "export-data") {
      openModal(`<h3>导出</h3><div class="row" style="justify-content:center;margin-top:1rem">
        <button type="button" class="primary" id="ex-json">JSON</button><button type="button" id="ex-csv">CSV</button><button type="button" class="ghost" id="modal-cancel">取消</button></div>`);
      document.getElementById("modal-cancel").onclick = closeModal;
      document.getElementById("ex-json").onclick = () => { exportJSON(); closeModal(); };
      document.getElementById("ex-csv").onclick = () => { exportCSV(); closeModal(); };
      return;
    }
    if (act === "goto-memories" && (state.config?.day || 1) >= 20) {
      location.href = location.pathname + "?mode=memories";
      return;
    }
    if (act === "gen-checkin-code") await generateCheckinCode();
    if (act === "refresh-checkin-code") await refreshCheckinCode();
    if (act === "end-checkin") await updatePaths({ "config/checkin_active": false, "config/checkin_code": "" });
    if (act === "toggle-session") {
      const next = (state.config?.checkin_session || "am") === "am" ? "pm" : "am";
      await updatePaths({ "config/checkin_session": next });
      const labelBtn = document.querySelector('[data-action="toggle-session"]');
      if (labelBtn) labelBtn.textContent = next === "am" ? "下午签到" : "上午签到";
    }
    if (act === "open-vote") {
      localStorage.removeItem(LS_VOTE_KEY);
      await updatePaths({ "config/voting_open": true });
      setTeacherView("vote");
      alert("投票已开启，请学生扫右侧二维码");
      return;
    }
    if (act === "close-vote") {
      await updatePaths({ "config/voting_open": false });
      setTeacherView("vote");
      if (confirm("投票已关闭。是否立刻颁奖？")) openAwardModal();
      return;
    }
    if (act === "reset-votes") {
      const updates = {};
      getPeaksArray().forEach((p) => updates[`peaks/${peakKey(p.id)}/votes`] = 0);
      getDisciplesArray().forEach((d) => { updates[`disciples/${d.id}/voted`] = false; updates[`disciples/${d.id}/voted_for`] = ""; });
      await updatePaths(updates); localStorage.removeItem(LS_VOTE_KEY);
    }
    if (act === "award") openAwardModal();
    if (act === "add-peak" || act === "add-peak-red") await addPeak("red");
    if (act === "add-peak-blue") await addPeak("blue");
    if (act === "add-disciple") editDiscipleModal("disciple_" + Date.now());
    if (act === "add-preset") editPresetModal("bp_" + Date.now());
    if (act === "settle-ranks") await doSettleRanks();
    if (act === "export-csv") exportCSV();
    if (act === "export-json") exportJSON();
  }

  function bindTeacherActions() {
    document.getElementById("teacher-screen").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      await handleTeacherAction(btn.dataset.action, btn);
    });
    const brandNav = document.getElementById("brand-nav");
    if (brandNav) {
      brandNav.addEventListener("click", async (e) => {
        if (e.target.closest("#brand-home") || e.target.closest(".brand-emblem")) {
          goHome();
          return;
        }
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        await handleTeacherAction(btn.dataset.action, btn);
      });
    }
    document.getElementById("day-input").addEventListener("change", async (e) => changeDay(e.target.value));
    document.getElementById("sort-mode").addEventListener("change", async (e) => {
      sortMode = e.target.value;
      await updatePaths({ "config/sort_mode": sortMode });
    });
    document.querySelectorAll("[data-log-filter]").forEach((btn) => {
      btn.addEventListener("click", () => {
        logFilter = btn.dataset.logFilter;
        document.querySelectorAll("[data-log-filter]").forEach((b) => b.classList.toggle("primary", b === btn));
        renderLogs();
      });
    });
    document.getElementById("log-search").addEventListener("input", () => renderLogs());
    document.getElementById("drawer-close").onclick = () => { document.getElementById("drawer-mask").classList.remove("show"); document.getElementById("peak-drawer").classList.remove("show"); };
    document.getElementById("drawer-mask").onclick = () => { document.getElementById("drawer-mask").classList.remove("show"); document.getElementById("peak-drawer").classList.remove("show"); };
  }
  function bindStudentActions() {
    document.getElementById("student-toggle-rank").onclick = () => {
      const panel = document.getElementById("student-rank-panel");
      panel.classList.toggle("hidden");
      if (!panel.classList.contains("hidden")) renderStudentRank();
    };
  }
  function bindMemoriesActions() {
    document.getElementById("memories-folder").addEventListener("change", (e) => onMemoriesFolder(e.target.files));
    document.getElementById("memories-bgm-file").addEventListener("change", (e) => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const audio = document.getElementById("memories-audio"); audio.src = URL.createObjectURL(f); audio.play().catch(()=>{});
    });
    document.getElementById("memories-controls").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-mem]"); if (btn) memControl(btn.dataset.mem);
    });
  }

  function showBootError(err) {
    const box = document.getElementById("boot-error");
    if (!box) return;
    box.classList.remove("hidden");
    box.textContent = "启动异常：" + (err && err.message ? err.message : String(err));
  }
  function bootDemo() {
    // clear old demo if schema too old
    const loaded = loadDemo();
    state = loaded || buildSeedArena();
    // ensure new fields
    if (!state.config) state.config = buildSeedArena().config;
    saveDemo();
  }
  async function init() {
    try {
      const { mode } = getMode();
      const m = ["teacher","student","checkin","memories"].includes(mode) ? mode : "teacher";
      showScreen(m);
      if (FIREBASE_READY && typeof firebase !== "undefined") {
        try {
          firebase.initializeApp(FIREBASE_CONFIG);
          db = firebase.database(); arenaRef = db.ref("arena");
          const snap = await arenaRef.once("value");
          if (!snap.exists()) await arenaRef.set(buildSeedArena());
          arenaRef.on("value", (s) => { state = s.val() || buildSeedArena(); renderAll(); });
          demoMode = false;
        } catch (err) { console.warn(err); demoMode = true; bootDemo(); }
      } else { demoMode = true; bootDemo(); }
      bindTeacherActions(); bindStudentActions(); bindMemoriesActions();
      ensureSfxToggle();
      ensureSwordCursorTrail();
      syncBrandNavVisibility();
      if (m === "teacher") setTeacherView("main");
      if (m === "memories") { /* loader */ } else renderAll();
      window.addEventListener("resize", () => {
        if (teacherView !== "main") return;
        const redN = getPeaksArray().filter((p) => p.camp !== "blue").length;
        const blueN = getPeaksArray().filter((p) => p.camp === "blue").length;
        applyArenaDensity(redN, blueN);
      });
      if (demoMode) {
        const tip = document.createElement("div");
        tip.className = "demo-tip";
        tip.style.cssText = "position:fixed;top:8px;left:8px;z-index:99;font-size:12px;color:#f0c14b;background:rgba(7,9,15,.9);padding:4px 10px;border:2px solid rgba(240,193,75,.5);letter-spacing:.08em";
        tip.textContent = "DEMO · ARENA";
        document.body.appendChild(tip);
      }
    } catch (err) { console.error(err); showBootError(err); try { showScreen("teacher"); bootDemo(); renderTeacherMain(); } catch(e2){} }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
  </script>
