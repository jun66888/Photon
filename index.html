<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>光影盟 · 联盟积分体系</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    // CDN 失败时不阻断页面（二维码降级为文字链接）
    window.__qrReady = typeof QRCode !== "undefined";
  </script>
  <style>
    :root {
      --bg: #0f0f1a;
      --bg-elev: #16162a;
      --bg-panel: #1a1a32;
      --gold: #d4af37;
      --gold-dim: #a88b2a;
      --red-camp: #3a1520;
      --red-border: #8b2942;
      --blue-camp: #152038;
      --blue-border: #2a4a8b;
      --text: #f0e6d2;
      --muted: #8a8499;
      --ok: #3dd68c;
      --danger: #ff5c7a;
      --info: #4aa3ff;
      --radius: 14px;
      --shadow: 0 10px 40px rgba(0,0,0,.45);
      --font: "Noto Sans SC", "PingFang SC", sans-serif;
      --display: "Orbitron", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(212,175,55,.12), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(74,163,255,.08), transparent 50%),
        linear-gradient(180deg, #121228 0%, var(--bg) 40%, #0c0c16 100%);
      color: var(--text);
      font-family: var(--font);
    }
    body { overflow-x: hidden; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button {
      cursor: pointer; border: 1px solid rgba(212,175,55,.35);
      background: linear-gradient(180deg, #2a2438, #1b1828);
      color: var(--text); border-radius: 10px; padding: .55rem 1rem;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    button:hover { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(212,175,55,.25); }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    button.primary {
      background: linear-gradient(135deg, #c9a227, #8a6d18);
      border-color: #e6c65a; color: #1a1408; font-weight: 700;
    }
    button.danger { border-color: var(--danger); color: #ffd0d8; }
    button.ghost { background: transparent; }
    .hidden { display: none !important; }
    .screen { min-height: 100vh; padding: 1rem 1.25rem 5rem; }
    .app-title {
      font-family: var(--display); letter-spacing: .06em;
      color: var(--gold); font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 700;
      text-shadow: 0 0 24px rgba(212,175,55,.35);
    }
    .muted { color: var(--muted); }
    .row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }
    .stack { display: flex; flex-direction: column; gap: .75rem; }
    .panel {
      background: linear-gradient(180deg, rgba(26,26,50,.95), rgba(16,16,30,.95));
      border: 1px solid rgba(212,175,55,.18);
      border-radius: var(--radius); padding: 1rem 1.1rem; box-shadow: var(--shadow);
    }
    .gold-line {
      height: 2px; margin: .75rem 0 1rem;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    input[type="text"], input[type="number"], select, textarea {
      background: #121222; border: 1px solid rgba(212,175,55,.25);
      border-radius: 10px; padding: .55rem .75rem; outline: none; width: 100%;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--gold); }

    /* Teacher */
    #teacher-screen .header-bar { justify-content: space-between; margin-bottom: 1rem; }
    .day-input { width: 4.5rem; text-align: center; font-size: 1.2rem; font-weight: 700; color: var(--gold); }
    .pk-bar {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: .75rem; align-items: center;
      margin-bottom: 1.25rem; padding: 1rem;
    }
    .pk-side { text-align: center; }
    .pk-side .score {
      font-family: var(--display); font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 700;
    }
    .pk-side.red .score { color: #ff6b8a; }
    .pk-side.blue .score { color: #6bb0ff; }
    .pk-track {
      height: 16px; border-radius: 999px; background: #0d0d18; overflow: hidden;
      display: flex; border: 1px solid rgba(255,255,255,.08); margin-top: .4rem;
    }
    .pk-track .fill-red { background: linear-gradient(90deg, #5a1d2d, #c43b5c); height: 100%; }
    .pk-track .fill-blue { background: linear-gradient(90deg, #2a5fcf, #1d3a6a); height: 100%; margin-left: auto; }
    .pk-vs {
      font-family: var(--display); color: var(--gold); font-size: 1.6rem;
      text-shadow: 0 0 18px rgba(212,175,55,.5);
    }
    .peaks-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem; margin-bottom: 1.25rem;
    }
    .peak-card {
      position: relative; border-radius: 16px; padding: 1rem 1rem 1.1rem;
      border: 1px solid transparent; cursor: pointer; overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .peak-card.red { background: linear-gradient(160deg, #4a1a28, var(--red-camp)); border-color: var(--red-border); }
    .peak-card.blue { background: linear-gradient(160deg, #1a2a4a, var(--blue-camp)); border-color: var(--blue-border); }
    .peak-card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,.4); }
    .peak-card .rank-badge {
      position: absolute; top: .6rem; right: .7rem; font-size: 1.4rem;
    }
    .peak-card .name-row { display: flex; align-items: center; gap: .5rem; font-size: 1.15rem; font-weight: 700; }
    .peak-card .level-name { color: var(--gold); font-size: .9rem; margin: .25rem 0 .5rem; }
    .peak-card .big-score {
      font-family: var(--display); font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 700; line-height: 1.1;
    }
    .exp-track {
      height: 14px; border-radius: 999px; background: rgba(0,0,0,.35);
      overflow: hidden; margin: .55rem 0 .35rem; border: 1px solid rgba(255,255,255,.08);
    }
    .exp-fill {
      height: 100%; width: 0%; border-radius: inherit;
      background: linear-gradient(90deg, #6b8cff, #d4af37);
      transition: width .45s ease;
    }
    .exp-fill.lv1 { background: linear-gradient(90deg, #6b8cff, #8ab0ff); }
    .exp-fill.lv2 { background: linear-gradient(90deg, #4aa3ff, #70e0a8); }
    .exp-fill.lv3 { background: linear-gradient(90deg, #70e0a8, #d4af37); }
    .exp-fill.lv4 { background: linear-gradient(90deg, #d4af37, #ff9f43); }
    .exp-fill.lv5 { background: linear-gradient(90deg, #ff9f43, #ff5c7a); }
    .exp-fill.blink { animation: barBlink 1s ease-in-out infinite; }
    @keyframes barBlink {
      0%,100% { filter: brightness(1); box-shadow: none; }
      50% { filter: brightness(1.35); box-shadow: 0 0 14px rgba(212,175,55,.7); }
    }
    .need-next { font-size: .85rem; color: var(--muted); }
    .need-next.urgent { color: #ffd76a; animation: urgentPulse 1s infinite; font-weight: 700; }
    @keyframes urgentPulse { 50% { opacity: .55; } }
    .recent-log { font-size: .82rem; color: #cfc4a8; min-height: 1.2em; margin-top: .35rem; }
    .peak-card.upgrading {
      animation: cardGlow 1.5s ease;
      z-index: 5;
    }
    @keyframes cardGlow {
      0% { box-shadow: 0 0 0 rgba(212,175,55,0); }
      30% { box-shadow: 0 0 40px rgba(212,175,55,.85); transform: scale(1.03); }
      100% { box-shadow: 0 0 18px rgba(212,175,55,.35); }
    }
    .peak-card.score-pop .big-score { animation: scorePop .3s ease; color: var(--ok); }
    .peak-card.task-pop .big-score { animation: scorePop .4s ease; color: var(--info); }
    .peak-card.arena-pop { animation: arenaPop .55s ease; }
    .peak-card.arena-pop .big-score { color: var(--gold); }
    @keyframes scorePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    @keyframes arenaPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .quick-bonus { margin-bottom: 1rem; }
    .quick-bonus .row { margin-bottom: .5rem; }
    .quick-bonus button {
      min-width: 6.5rem; font-weight: 600;
      background: linear-gradient(180deg, #2c2640, #191628);
    }
    .func-bar button { min-width: 7rem; }
    .ticker {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: rgba(10,10,18,.92); border-top: 1px solid rgba(212,175,55,.25);
      padding: .55rem 0; overflow: hidden; white-space: nowrap;
    }
    .ticker-inner {
      display: inline-block; padding-left: 100%;
      animation: ticker 28s linear infinite; color: #e8d9a8;
    }
    @keyframes ticker { to { transform: translateX(-100%); } }

    /* Side panel */
    .drawer-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .drawer-mask.show { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; right: 0; width: min(420px, 96vw); height: 100%;
      background: #141428; border-left: 1px solid rgba(212,175,55,.3);
      z-index: 41; transform: translateX(100%); transition: transform .25s ease;
      padding: 1.1rem; overflow-y: auto;
    }
    .drawer.show { transform: translateX(0); }
    .list-item {
      display: flex; justify-content: space-between; gap: .5rem;
      padding: .55rem .2rem; border-bottom: 1px solid rgba(255,255,255,.06); font-size: .92rem;
    }

    /* Subviews / modal */
    .subview { animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 50;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal {
      width: min(520px, 96vw); background: #17172c; border: 1px solid rgba(212,175,55,.35);
      border-radius: 16px; padding: 1.2rem; box-shadow: var(--shadow); max-height: 90vh; overflow: auto;
    }
    .modal h3 { color: var(--gold); margin-bottom: .75rem; }
    .toast-levelup {
      position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.72); pointer-events: none;
      animation: fadeIn .2s ease;
    }
    .toast-levelup .msg {
      font-size: clamp(1.4rem, 4vw, 2.4rem); font-weight: 900; color: var(--gold);
      text-shadow: 0 0 30px rgba(212,175,55,.8); text-align: center; padding: 1rem;
    }
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
    .particle {
      position: absolute; width: 8px; height: 8px; border-radius: 50%;
      animation: particleFly .9s ease-out forwards;
    }
    @keyframes particleFly {
      to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }
    .flash-gold {
      position: fixed; inset: 0; background: radial-gradient(circle, rgba(212,175,55,.55), transparent 60%);
      z-index: 75; pointer-events: none; animation: flashOut 1s ease forwards;
    }
    @keyframes flashOut { from { opacity: 1; } to { opacity: 0; } }

    .checkin-board .progress-line {
      height: 12px; background: #0d0d18; border-radius: 999px; overflow: hidden; margin: .5rem 0 1rem;
    }
    .checkin-board .progress-line > div {
      height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); width: 0%;
    }
    .qr-box {
      background: #fff; padding: 12px; border-radius: 12px; display: inline-block;
    }
    .qr-box canvas, .qr-box img { display: block; }
    .name-chip {
      display: inline-block; margin: .25rem; padding: .35rem .65rem; border-radius: 999px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); font-size: .9rem;
    }
    .name-chip.ok { border-color: rgba(61,214,140,.5); color: var(--ok); }
    .name-chip.miss { border-color: rgba(255,92,122,.4); color: #ffb0bf; }

    .vote-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .9rem;
    }
    .vote-card {
      border-radius: 14px; padding: 1rem; border: 1px solid rgba(212,175,55,.2);
      background: var(--bg-panel); text-align: center;
    }
    .vote-card .votes {
      font-family: var(--display); font-size: 2.2rem; color: var(--gold); margin: .4rem 0;
    }

    /* Student / Checkin mobile */
    .mobile-shell { max-width: 480px; margin: 0 auto; padding-bottom: 2rem; }
    .identity-card {
      border: 1px solid rgba(212,175,55,.3); border-radius: 16px; padding: 1rem;
      background: linear-gradient(160deg, #24203a, #151528);
    }
    .big-vote-btn {
      width: 100%; margin-top: .65rem; padding: .85rem; font-size: 1.05rem; font-weight: 800;
      background: linear-gradient(135deg, #e0c04a, #b89220); color: #1a1408; border: none;
    }
    .success-burst {
      font-size: 4rem; text-align: center; animation: scorePop .5s ease;
      filter: drop-shadow(0 0 20px rgba(61,214,140,.8));
    }
    .badge-fly {
      display: inline-block; animation: badgeFly 1s ease forwards;
      background: linear-gradient(135deg, #d4af37, #8a6d18); color: #1a1408;
      padding: .4rem .9rem; border-radius: 999px; font-weight: 800;
    }
    @keyframes badgeFly {
      0% { transform: translateY(20px) scale(.6); opacity: 0; }
      40% { transform: translateY(-10px) scale(1.15); opacity: 1; }
      100% { transform: translateY(0) scale(1); }
    }

    /* Memories */
    #memories-screen {
      position: fixed; inset: 0; background: #05050c; z-index: 5; padding: 0; overflow: hidden;
    }
    #memories-stage {
      position: absolute; inset: 0 0 72px 0; overflow: hidden;
    }
    .mem-controls {
      position: absolute; left: 0; right: 0; bottom: 0; height: 72px;
      background: rgba(10,10,18,.78); backdrop-filter: blur(8px);
      border-top: 1px solid rgba(212,175,55,.25);
      display: flex; align-items: center; justify-content: center; gap: .45rem; flex-wrap: wrap;
      padding: .4rem .6rem; z-index: 10;
    }
    .mem-controls button { padding: .4rem .7rem; font-size: .85rem; }
    .timeline-track {
      display: flex; align-items: flex-end; gap: 18px; height: 100%;
      padding: 8vh 10vw; will-change: transform;
    }
    .timeline-item {
      flex: 0 0 auto; width: min(42vw, 360px); opacity: .55; transform: scale(.86);
      transition: transform .5s ease, opacity .5s ease; position: relative;
    }
    .timeline-item.active { opacity: 1; transform: scale(1.05); z-index: 2; }
    .timeline-item img, .timeline-item video {
      width: 100%; max-height: 62vh; object-fit: cover; border-radius: 10px;
      border: 1px solid rgba(212,175,55,.25); display: block; background: #111;
    }
    .timeline-ruler {
      position: absolute; left: 0; right: 0; bottom: 78px; height: 28px;
      border-top: 1px solid rgba(212,175,55,.35); color: var(--muted); font-size: .75rem;
      display: flex; justify-content: space-between; padding: .25rem 8vw 0;
    }
    .waterfall-layer { position: absolute; inset: 0; overflow: hidden; }
    .waterfall-item {
      position: absolute; border-radius: 8px; overflow: hidden;
      animation: fallDown linear forwards;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
    }
    .waterfall-item img, .waterfall-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
    @keyframes fallDown {
      from { transform: translateY(-40vh) rotate(var(--rot)); opacity: 0; }
      15% { opacity: 1; }
      to { transform: translateY(110vh) rotate(calc(var(--rot) * -1)); opacity: .85; }
    }
    .flashback-frame {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    .flashback-frame img, .flashback-frame video {
      max-width: 92vw; max-height: 78vh; object-fit: contain;
      animation: flashIn .15s ease;
    }
    @keyframes flashIn { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: none; } }
    .ending-grid {
      position: absolute; inset: 0; display: grid; place-items: center; background: #05050c;
      padding: 4vh 4vw 90px;
    }
    .ending-grid .mosaic {
      display: grid; gap: 3px; width: min(90vw, 900px);
      grid-template-columns: repeat(8, 1fr);
    }
    .ending-grid .mosaic img {
      width: 100%; aspect-ratio: 1; object-fit: cover; opacity: .9;
    }
    .ending-hero {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #05050c;
    }
    .ending-hero img {
      max-width: 88vw; max-height: 70vh; object-fit: contain;
      filter: blur(12px); transition: filter 2.5s ease; border-radius: 8px;
    }
    .ending-hero img.sharp { filter: blur(0); }
    .ending-text {
      position: absolute; bottom: 20%; left: 0; right: 0; text-align: center;
      font-size: clamp(1.3rem, 4vw, 2.4rem); font-weight: 900; color: var(--gold);
      text-shadow: 0 0 24px rgba(212,175,55,.6); opacity: 0; transition: opacity 1s ease;
    }
    .ending-text.show { opacity: 1; }
    .loader-box { max-width: 520px; margin: 12vh auto; text-align: center; }

    .settings-section h4 { color: var(--gold); margin: .8rem 0 .45rem; }
    .table-like { width: 100%; font-size: .88rem; }
    .table-like .list-item span:first-child { flex: 1; }
    .search-box { max-width: 280px; }
    .highlight { outline: 2px solid var(--gold); box-shadow: 0 0 24px rgba(212,175,55,.45); }

    @media (max-width: 640px) {
      .screen { padding: .85rem .85rem 4.5rem; }
      .func-bar button, .quick-bonus button { min-width: auto; flex: 1 1 42%; }
      .pk-bar { grid-template-columns: 1fr; text-align: center; }
      .pk-vs { order: -1; }
    }
  </style>
</head>
<body>
  <noscript>
    <div style="padding:2rem;color:#d4af37;background:#0f0f1a;min-height:100vh;font-family:sans-serif">
      需要启用 JavaScript 才能使用光影盟积分体系。
    </div>
  </noscript>
  <div id="boot-error" class="hidden" style="padding:1.5rem;color:#ff5c7a;background:#1a1020;border-bottom:1px solid #d4af37"></div>

  <!-- ===================== TEACHER ===================== -->
  <div id="teacher-screen" class="screen">
    <div id="teacher-main" class="subview">
      <div class="row header-bar">
        <div class="app-title">🏔️ 联盟积分榜 · 第<span id="day-label">1</span>天</div>
        <div class="row">
          <label class="muted">天数</label>
          <input id="day-input" class="day-input" type="number" min="1" value="1" />
        </div>
      </div>

      <div class="panel pk-bar" id="pk-bar">
        <div class="pk-side red">
          <div>🔴 光影联盟</div>
          <div class="score" id="red-total">0</div>
          <div class="pk-track"><div class="fill-red" id="red-fill" style="width:50%"></div></div>
        </div>
        <div class="pk-vs">⚔️</div>
        <div class="pk-side blue">
          <div>🔵 声浪联盟</div>
          <div class="score" id="blue-total">0</div>
          <div class="pk-track"><div class="fill-blue" id="blue-fill" style="width:50%"></div></div>
        </div>
      </div>

      <div class="peaks-grid" id="peaks-grid"></div>

      <div class="panel quick-bonus">
        <div class="muted" style="margin-bottom:.5rem">快捷加分</div>
        <div class="row" id="bonus-row-1"></div>
        <div class="row" id="bonus-row-2"></div>
      </div>

      <div class="row func-bar panel">
        <button type="button" data-action="custom-score">🔧 自定义加分</button>
        <button type="button" data-action="goto-checkin">📋 签到模式</button>
        <button type="button" data-action="goto-vote">📊 投票模式</button>
        <button type="button" data-action="goto-logs">📜 积分日志</button>
        <button type="button" data-action="goto-settings">⚙️ 设置</button>
        <button type="button" data-action="export-data">📥 导出</button>
        <button type="button" id="btn-memories" data-action="goto-memories" disabled>🎓 毕业回忆</button>
      </div>
    </div>

    <!-- Checkin subview -->
    <div id="teacher-checkin" class="subview checkin-board hidden">
      <div class="row" style="justify-content:space-between;margin-bottom:1rem">
        <div class="app-title" style="font-size:1.5rem">📋 签到看板·<span id="checkin-session-label">上午</span>签到</div>
        <button type="button" data-action="back-main" class="ghost">返回主看板</button>
      </div>
      <div class="panel">
        <div>已签到 <strong id="checkin-count">0</strong> / <strong id="checkin-total">25</strong></div>
        <div class="progress-line"><div id="checkin-progress"></div></div>
        <div class="row" style="margin-bottom:1rem">
          <button type="button" class="primary" data-action="gen-checkin-code">生成签到码</button>

  <script>
  /******************************************************************
   * 光影盟 · 联盟积分体系
   * Firebase 配置区 —— 请替换为你自己的项目配置
   ******************************************************************/
  const FIREBASE_CONFIG = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  /** 是否使用本地演示模式（Firebase 未配置时自动启用） */
  const FIREBASE_READY = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY"
    && FIREBASE_CONFIG.databaseURL.indexOf("YOUR_PROJECT") === -1;

  const OPERATOR = "李红星";
  const LS_STUDENT_KEY = "gy_arena_student";
  const LS_VOTE_KEY = "gy_arena_vote";
  const DEMO_DB_KEY = "gy_arena_demo_db";

  /* -------------------- 段位 / 等级计算 -------------------- */
  const PEAK_THRESHOLDS = [
    { level: 1, name: "入门", min: 0, next: 500 },
    { level: 2, name: "筑基", min: 500, next: 1500 },
    { level: 3, name: "金丹", min: 1500, next: 3000 },
    { level: 4, name: "元婴", min: 3000, next: 5000 },
    { level: 5, name: "化神", min: 5000, next: null }
  ];

  function calcPeakLevel(score) {
    const s = Math.max(0, Number(score) || 0);
    let tier = PEAK_THRESHOLDS[0];
    for (const t of PEAK_THRESHOLDS) {
      if (s >= t.min) tier = t;
    }
    if (tier.next == null) {
      return { peak_level: 5, peak_level_name: "化神", progress: 100, next_level_score: s };
    }
    const progress = ((s - tier.min) / (tier.next - tier.min)) * 100;
    return {
      peak_level: tier.level,
      peak_level_name: tier.name,
      progress: Math.max(0, Math.min(100, progress)),
      next_level_score: tier.next
    };
  }

  function expNeededForLevel(level) {
    if (level <= 10) return 300;
    if (level <= 20) return 500;
    return 800;
  }

  function titleForLevel(level) {
    if (level <= 4) return "见习创作者";
    if (level <= 9) return "初级创作者";
    if (level <= 14) return "进阶创作者";
    if (level <= 19) return "高级创作者";
    if (level <= 24) return "资深创作者";
    if (level <= 29) return "全能创作者";
    return "认证创作者";
  }

  function calcPersonalLevel(exp) {
    let remain = Math.max(0, Number(exp) || 0);
    let level = 1;
    while (level < 30) {
      const need = expNeededForLevel(level);
      if (remain < need) break;
      remain -= need;
      level += 1;
    }
    return { level, title: titleForLevel(level), remainder: remain, need: expNeededForLevel(level) };
  }

  /** 阵营内按 contributed 结算段位 */
  function settleRanks(disciples) {
    const camps = { red: [], blue: [] };
    Object.entries(disciples || {}).forEach(([id, d]) => {
      if (!d) return;
      const camp = d.camp === "blue" ? "blue" : "red";
      camps[camp].push({ id, ...d });
    });
    const result = {};
    for (const camp of ["red", "blue"]) {
      const list = camps[camp].slice().sort((a, b) => (b.contributed || 0) - (a.contributed || 0));
      const n = list.length || 1;
      list.forEach((d, idx) => {
        let rank = "白银";
        if (idx === 0) rank = "最强王者";
        else if (idx < Math.ceil(n * 0.2)) rank = "钻石";
        else if (idx < Math.ceil(n * 0.5)) rank = "黄金";
        else rank = "白银";
        result[d.id] = rank;
      });
    }
    return result;
  }

  /* -------------------- 种子数据 -------------------- */
  const PEAK_SEED = [
    { id: 0, name: "光影峰", icon: "🦁", slogan: "用画面讲故事", camp: "red" },
    { id: 1, name: "创意峰", icon: "🦅", slogan: "创意无限", camp: "red" },
    { id: 2, name: "追光峰", icon: "🐉", slogan: "追光逐影", camp: "red" },
    { id: 3, name: "声浪峰", icon: "🎵", slogan: "用声音传情绪", camp: "blue" },
    { id: 4, name: "音浪峰", icon: "🌊", slogan: "声动九州", camp: "blue" }
  ];

  const NAME_SEED = [
    "赵伟","钱芳","孙娜","李敏","周静","吴丽","郑强","王磊","冯军","陈洋",
    "褚勇","卫艳","蒋杰","沈涛","韩明","杨超","朱秀英","秦霞","尤平","许刚",
    "何桂英","吕建华","施伟","张芳","孔娜"
  ];

  const BONUS_PRESETS_SEED = [
    { id: "bp0", label: "✅签到+2", points: 2, reason: "签到", category: "日常", row: 1 },
    { id: "bp1", label: "🙋答题+1", points: 1, reason: "答题", category: "日常", row: 1 },
    { id: "bp2", label: "🤝助人+3", points: 3, reason: "助人", category: "日常", row: 1 },
    { id: "bp3", label: "📝打卡+2", points: 2, reason: "打卡", category: "日常", row: 1 },
    { id: "bp4", label: "💬点评+2", points: 2, reason: "点评", category: "日常", row: 1 },
    { id: "bp5", label: "🎯基础+5", points: 5, reason: "基础任务", category: "任务", row: 2 },
    { id: "bp6", label: "⭐进阶+10", points: 10, reason: "进阶任务", category: "任务", row: 2 },
    { id: "bp7", label: "🌟挑战+15", points: 15, reason: "挑战任务", category: "任务", row: 2 },
    { id: "bp8", label: "🥇+30", points: 30, reason: "擂台金牌", category: "擂台", row: 2 },
    { id: "bp9", label: "🥈+20", points: 20, reason: "擂台银牌", category: "擂台", row: 2 },
    { id: "bp10", label: "🥉+10", points: 10, reason: "擂台铜牌", category: "擂台", row: 2 },
    { id: "bp11", label: "✨课堂表现+2", points: 2, reason: "课堂表现", category: "日常", row: 1 },
    { id: "bp12", label: "📤作品分享+3", points: 3, reason: "作品分享", category: "日常", row: 1 }
  ];

  const TASKS_SEED = [
    { id: "task0", title: "基础任务", points: 5, category: "任务", desc: "完成当日基础创作练习" },
    { id: "task1", title: "进阶任务", points: 10, category: "任务", desc: "完成进阶作品挑战" },
    { id: "task2", title: "挑战任务", points: 15, category: "任务", desc: "完成高难度挑战项目" }
  ];

  function makePeak(meta) {
    const level = calcPeakLevel(0);
    return {
      id: meta.id,
      name: meta.name,
      icon: meta.icon,
      slogan: meta.slogan,
      camp: meta.camp,
      score: 0,
      votes: 0,
      peak_level: level.peak_level,
      peak_level_name: level.peak_level_name,
      progress: level.progress,
      next_level_score: level.next_level_score
    };
  }

  function makeDisciple(i, name) {
    let peak, camp;
    if (i < 15) {
      camp = "red";
      peak = Math.floor(i / 5); // 0,1,2 each 5
    } else {
      camp = "blue";
      peak = 3 + Math.floor((i - 15) / 5); // 3,4 each 5
    }
    const lv = calcPersonalLevel(0);
    return {
      name,
      student_id: "",
      peak,
      camp,
      exp: 0,
      level: lv.level,
      title: lv.title,
      rank: "青铜",
      voted: false,
      contributed: 0,
      checked_in_am: false,
      checked_in_pm: false,
      first_seen: "",
      voted_for: ""
    };
  }

  function buildSeedArena() {
    const peaks = {};
    PEAK_SEED.forEach((p) => { peaks["peak_" + p.id] = makePeak(p); });
    const disciples = {};
    NAME_SEED.forEach((n, i) => { disciples["disciple_" + i] = makeDisciple(i, n); });
    const bonus_presets = {};
    BONUS_PRESETS_SEED.forEach((b) => { bonus_presets[b.id] = b; });
    const tasks = {};
    TASKS_SEED.forEach((t) => { tasks[t.id] = t; });
    return {
      config: {
        day: 1,
        week: 1,
        voting_open: false,
        title: "第1周最佳作品",
        checkin_code: "",
        checkin_expires_at: 0,
        checkin_session: "am",
        checkin_active: false
      },
      peaks,
      disciples,
      score_logs: {},
      bonus_presets,
      tasks
    };
  }

  /* -------------------- 状态与存储层 -------------------- */
  let db = null;
  let arenaRef = null;
  let state = buildSeedArena();
  let demoMode = !FIREBASE_READY;
  let recentRotateTimer = null;
  let recentLogIndex = 0;
  let checkinRefreshTimer = null;
  let logFilter = "today";
  let teacherView = "main";
  let selectedPeakId = null;
  const peakPrevLevels = {};

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

  function saveDemo() {
    try { localStorage.setItem(DEMO_DB_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function loadDemo() {
    try {
      const raw = localStorage.getItem(DEMO_DB_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }

  function getPeaksArray() {
    return Object.values(state.peaks || {}).filter(Boolean).sort((a, b) => a.id - b.id);
  }

  function getDisciplesArray() {
    return Object.entries(state.disciples || {}).map(([id, d]) => ({ id, ...d }));
  }

  function getLogsArray() {
    const logs = state.score_logs || {};
    return Object.entries(logs).map(([id, l]) => ({ id, ...l }))
      .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
  }

  function getPresetsArray() {
    return Object.values(state.bonus_presets || {}).filter(Boolean)
      .sort((a, b) => String(a.id).localeCompare(String(b.id)));
  }

  function peakKey(id) { return "peak_" + id; }

  function findPeak(id) {
    return (state.peaks || {})[peakKey(id)] || Object.values(state.peaks || {}).find((p) => p && p.id === id);
  }

  async function writeArenaPatch(patch) {
    if (demoMode) {
      // deep merge shallow keys
      Object.keys(patch).forEach((k) => {
        if (patch[k] && typeof patch[k] === "object" && !Array.isArray(patch[k]) && state[k] && typeof state[k] === "object") {
          state[k] = { ...state[k], ...patch[k] };
          Object.keys(patch[k]).forEach((sk) => {
            if (patch[k][sk] && typeof patch[k][sk] === "object" && !Array.isArray(patch[k][sk]) && state[k][sk] && typeof state[k][sk] === "object") {
              state[k][sk] = { ...state[k][sk], ...patch[k][sk] };
            }
          });
        } else {
          state[k] = patch[k];
        }
      });
      // Better: apply firebase-style slash paths if needed — for demo use full replace helpers below
      saveDemo();
      renderAll();
      return;
    }
    await arenaRef.update(flattenUpdate(patch));
  }

  function flattenUpdate(obj, prefix = "") {
    const out = {};
    Object.keys(obj || {}).forEach((k) => {
      const path = prefix ? prefix + "/" + k : k;
      const v = obj[k];
      if (v !== null && typeof v === "object" && !Array.isArray(v)) {
        Object.assign(out, flattenUpdate(v, path));
      } else {
        out[path] = v;
      }
    });
    return out;
  }

  /** 乐观更新本地 state（路径形如 peaks/peak_0/score） */
  function applyLocalPath(path, value) {
    const parts = path.split("/");
    let cur = state;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!cur[parts[i]] || typeof cur[parts[i]] !== "object") cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    const leaf = parts[parts.length - 1];
    if (value === null) delete cur[leaf];
    else cur[leaf] = value;
  }

  async function setPath(path, value) {
    applyLocalPath(path, value);
    if (demoMode) {
      saveDemo();
      renderAll();
      return;
    }
    await arenaRef.child(path).set(value);
  }

  async function updatePaths(updates) {
    Object.entries(updates).forEach(([path, value]) => applyLocalPath(path, value));
    if (demoMode) {
      saveDemo();
      renderAll();
      return;
    }
    await arenaRef.update(updates);
  }

  async function pushLog(entry) {
    const id = "log_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    if (!state.score_logs) state.score_logs = {};
    if (demoMode) {
      state.score_logs[id] = entry;
      saveDemo();
      return id;
    }
    const ref = await arenaRef.child("score_logs").push(entry);
    state.score_logs[ref.key] = entry;
    return ref.key;
  }

  /* -------------------- 核心加分 -------------------- */
  async function addScoreToPeak(peakId, points, reason, category, opts = {}) {
    const peak = findPeak(peakId);
    if (!peak) { alert("未找到山峰"); return null; }
    const pts = Number(points) || 0;
    if (!pts) { alert("分数无效"); return null; }

    const oldLevel = peak.peak_level;
    const newScore = (peak.score || 0) + pts;
    const levelInfo = calcPeakLevel(newScore);
    const day = (state.config && state.config.day) || 1;

    const updates = {};
    updates[`peaks/${peakKey(peak.id)}/score`] = newScore;
    updates[`peaks/${peakKey(peak.id)}/peak_level`] = levelInfo.peak_level;
    updates[`peaks/${peakKey(peak.id)}/peak_level_name`] = levelInfo.peak_level_name;
    updates[`peaks/${peakKey(peak.id)}/progress`] = levelInfo.progress;
    updates[`peaks/${peakKey(peak.id)}/next_level_score`] = levelInfo.next_level_score;

    // 弟子经验同步
    const bonusExp = opts.awardBonusExp || 0; // 额外颁奖经验
    getDisciplesArray().filter((d) => d.peak === peak.id).forEach((d) => {
      const addExp = pts * 10 + bonusExp;
      const newExp = (d.exp || 0) + addExp;
      const lv = calcPersonalLevel(newExp);
      updates[`disciples/${d.id}/exp`] = newExp;
      updates[`disciples/${d.id}/level`] = lv.level;
      updates[`disciples/${d.id}/title`] = lv.title;
      updates[`disciples/${d.id}/contributed`] = (d.contributed || 0) + pts;
    });

    await updatePaths(updates);
    await pushLog({
      timestamp: Date.now(),
      peak_id: peak.id,
      peak_name: peak.name,
      reason: reason || "加分",
      points: pts,
      category: category || "日常",
      operator: OPERATOR,
      day
    });

    // 动画
    playScoreAnimation(peak.id, pts, category || "日常");
    if (levelInfo.peak_level > oldLevel) {
      playLevelUpAnimation(peak, oldLevel, levelInfo);
    }
    return { newScore, levelInfo, leveledUp: levelInfo.peak_level > oldLevel };
  }

  function playScoreAnimation(peakId, points, category) {
    const el = document.querySelector(`.peak-card[data-peak-id="${peakId}"]`);
    if (!el) return;
    el.classList.remove("score-pop", "task-pop", "arena-pop");
    void el.offsetWidth;
    if (category === "擂台" || points >= 10 && category === "擂台") {
      el.classList.add("arena-pop");
      spawnParticles(el, "#d4af37", 28);
    } else if (category === "任务" || (points >= 5 && points <= 15 && category !== "日常")) {
      el.classList.add("task-pop");
      spawnParticles(el, "#4aa3ff", 18);
    } else {
      el.classList.add("score-pop");
    }
    setTimeout(() => el.classList.remove("score-pop", "task-pop", "arena-pop"), 700);
  }

  function spawnParticles(anchorEl, color, count) {
    const host = document.getElementById("fx-host");
    const layer = document.createElement("div");
    layer.className = "particles";
    const rect = anchorEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < count; i++) {
      const p = document.createElement("div");
      p.className = "particle";
      const ang = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * 120;
      p.style.left = cx + "px";
      p.style.top = cy + "px";
      p.style.background = color;
      p.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      p.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      layer.appendChild(p);
    }
    host.appendChild(layer);
    setTimeout(() => layer.remove(), 1000);
  }

  function playLevelUpAnimation(peak, oldLevel, levelInfo) {
    const el = document.querySelector(`.peak-card[data-peak-id="${peak.id}"]`);
    const host = document.getElementById("fx-host");
    const flash = document.createElement("div");
    flash.className = "flash-gold";
    host.appendChild(flash);
    if (el) {
      el.classList.add("upgrading", "highlight");
      spawnParticles(el, "#d4af37", 40);
    }
    const toast = document.createElement("div");
    toast.className = "toast-levelup";
    toast.innerHTML = `<div class="msg">🔥 ${peak.name}突破！${PEAK_THRESHOLDS[oldLevel-1]?.name || ""}→${levelInfo.peak_level_name} 🎉</div>`;
    host.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
    setTimeout(() => flash.remove(), 1000);
    setTimeout(() => { if (el) el.classList.remove("upgrading", "highlight"); }, 3000);
  }

    let red = 0, blue = 0;
    getPeaksArray().forEach((p) => {
      if (p.camp === "blue") blue += p.score || 0;
      else red += p.score || 0;
    });
    return { red, blue };
  }

  function renderTeacherMain() {
    const day = state.config?.day || 1;
    document.getElementById("day-label").textContent = day;
    const dayInput = document.getElementById("day-input");
    if (document.activeElement !== dayInput) dayInput.value = day;

    const { red, blue } = campTotals();
    document.getElementById("red-total").textContent = red;
    document.getElementById("blue-total").textContent = blue;
    const sum = red + blue || 1;
    document.getElementById("red-fill").style.width = (red / sum * 100) + "%";
    document.getElementById("blue-fill").style.width = (blue / sum * 100) + "%";

    const memBtn = document.getElementById("btn-memories");
    memBtn.disabled = day < 20;
    memBtn.style.opacity = day < 20 ? .45 : 1;

    const ranked = getPeaksArray().slice().sort((a, b) => (b.score || 0) - (a.score || 0));
    const grid = document.getElementById("peaks-grid");
    const medals = ["🥇", "🥈", "🥉"];
    const logs = getLogsArray();

    grid.innerHTML = ranked.map((p, idx) => {
      const remain = Math.max(0, (p.next_level_score || 0) - (p.score || 0));
      const urgent = p.peak_level < 5 && remain <= 100;
      const blink = (p.progress || 0) > 90;
      const latest = logs.find((l) => l.peak_id === p.id);
      const recentText = latest ? `最近：${latest.reason} +${latest.points}分` : "最近：暂无记录";
      return `
        <div class="peak-card ${p.camp}" data-peak-id="${p.id}">
          <div class="rank-badge">${medals[idx] || (idx + 1)}</div>
          <div class="name-row"><span>${p.icon || ""}</span><span>${p.name}</span></div>
          <div class="level-name">${p.peak_level_name || "入门"} · Lv${p.peak_level || 1}</div>
          <div class="big-score">${p.score || 0}</div>
          <div class="exp-track"><div class="exp-fill lv${p.peak_level || 1} ${blink ? "blink" : ""}" style="width:${p.progress || 0}%"></div></div>
          <div class="need-next ${urgent ? "urgent" : ""}">${p.peak_level >= 5 ? "已达最高段位" : `距下一级还差${remain}分`}</div>
          <div class="recent-log" data-peak-recent="${p.id}">${recentText}</div>
        </div>`;
    }).join("");

    grid.querySelectorAll(".peak-card").forEach((card) => {
      card.addEventListener("click", () => openPeakDrawer(Number(card.dataset.peakId)));
    });

    // 快捷加分按钮
    const presets = getPresetsArray();
    const row1 = document.getElementById("bonus-row-1");
    const row2 = document.getElementById("bonus-row-2");
    const r1 = presets.filter((p) => (p.row || 1) === 1);
    const r2 = presets.filter((p) => (p.row || 1) === 2);
    const fill = (el, list) => {
      el.innerHTML = list.map((p) =>
        `<button type="button" data-bonus-id="${p.id}">${p.label}</button>`
      ).join("");
      el.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          const preset = (state.bonus_presets || {})[btn.dataset.bonusId];
          if (preset) openPeakPickModal(preset.points, preset.reason, preset.category);
        });
      });
    };
    fill(row1, r1.length ? r1 : presets.slice(0, 5));
    fill(row2, r2.length ? r2 : presets.slice(5));

    // 底部滚动
    const today = logs.filter((l) => l.day === day).slice(0, 30);
    const ticker = document.getElementById("ticker-text");
    if (today.length) {
      ticker.textContent = "📜 今日动态：" + today.map((l) => `${l.peak_name}+${l.points}(${l.reason})`).join(" | ");

      ticker.textContent = "📜 今日动态：暂无记录";

  function startRecentRotate() {
    if (recentRotateTimer) clearInterval(recentRotateTimer);

      recentLogIndex += 1;
      const logs = getLogsArray();
      document.querySelectorAll("[data-peak-recent]").forEach((el) => {
        const pid = Number(el.dataset.peakRecent);
        const peakLogs = logs.filter((l) => l.peak_id === pid);
        if (!peakLogs.length) return;
        const item = peakLogs[recentLogIndex % peakLogs.length];
        el.textContent = `最近：${item.reason} +${item.points}分`;

  function fmtTime(ts) {

  function pad(n) { return String(n).padStart(2, "0"); }

  /* -------------------- 签到（老师） -------------------- */
  function randCode() {
    return String(Math.floor(100000 + Math.random() * 900000));
  }

  async function generateCheckinCode() {
    const code = randCode();
    const expires = Date.now() + 30000;
    await updatePaths({
      "config/checkin_code": code,
      "config/checkin_expires_at": expires,
      "config/checkin_active": true
    });
    startCheckinRefreshLoop();
    renderTeacherCheckin();
  }

  function startCheckinRefreshLoop() {
    if (checkinRefreshTimer) clearInterval(checkinRefreshTimer);
    checkinRefreshTimer = setInterval(async () => {
      if (teacherView !== "checkin") return;
      if (!state.config?.checkin_active) return;
      const exp = state.config.checkin_expires_at || 0;
      const left = Math.max(0, Math.ceil((exp - Date.now()) / 1000));
      const cd = document.getElementById("checkin-countdown");
      if (cd) cd.textContent = String(left);
      if (left <= 0) {
        const code = randCode();
        await updatePaths({
          "config/checkin_code": code,
          "config/checkin_expires_at": Date.now() + 30000
        });
      }
    }, 500);
  }

  function renderTeacherCheckin() {
    const session = state.config?.checkin_session || "am";
    document.getElementById("checkin-session-label").textContent = session === "pm" ? "下午" : "上午";
    const flag = session === "pm" ? "checked_in_pm" : "checked_in_am";
    const disciples = getDisciplesArray().slice().sort((a, b) => String(a.student_id || "999").localeCompare(String(b.student_id || "999")));
    const checked = disciples.filter((d) => d[flag]);
    const unchecked = disciples.filter((d) => !d[flag]);
    document.getElementById("checkin-count").textContent = checked.length;
    document.getElementById("checkin-total").textContent = disciples.length;
    document.getElementById("checkin-progress").style.width = (disciples.length ? checked.length / disciples.length * 100 : 0) + "%";
    document.getElementById("checked-list").innerHTML = checked.map((d) =>
      `<span class="name-chip ok">${d.student_id || "---"} ${d.name}</span>`).join("") || '<span class="muted">暂无</span>';
    document.getElementById("unchecked-list").innerHTML = unchecked.map((d) =>
      `<span class="name-chip miss">${d.student_id || "未注册"} ${d.name}</span>`).join("") || '<span class="muted">全员已签</span>';

    const code = state.config?.checkin_code || "------";
    document.getElementById("checkin-code-text").textContent = code;
    const left = Math.max(0, Math.ceil(((state.config?.checkin_expires_at || 0) - Date.now()) / 1000));
    document.getElementById("checkin-countdown").textContent = String(left || 0);

    const qrHost = document.getElementById("checkin-qr");
    qrHost.innerHTML = "";
    if (state.config?.checkin_active && code && code !== "------") {
      const url = `${location.origin}${location.pathname}?mode=checkin&code=${code}`;
      renderQr(qrHost, url, 180);
    } else {
      qrHost.innerHTML = '<div class="muted" style="padding:2rem;color:#333">点击生成签到码</div>';
    }
  }

  function renderQr(host, url, size) {
    host.innerHTML = "";
    if (typeof QRCode !== "undefined" && QRCode.toCanvas) {
      QRCode.toCanvas(url, { width: size, margin: 1 }, (err, canvas) => {
        if (!err && canvas) host.appendChild(canvas);
        else host.innerHTML = `<a href="${url}" style="color:#333;word-break:break-all">${url}</a>`;
      });
    } else {
      host.innerHTML = `<div style="padding:.5rem;max-width:${size}px"><a href="${url}" style="color:#111;word-break:break-all;font-size:12px">${url}</a></div>`;
    }
  }

  function exportJSON() {
    downloadBlob("arena-export.json", JSON.stringify(state, null, 2), "application/json");
  }

  function exportCSV() {
    const logs = getLogsArray();
    const header = "timestamp,day,peak_name,points,reason,category,operator\n";
    const rows = logs.map((l) =>
      [l.timestamp, l.day, csvEsc(l.peak_name), l.points, csvEsc(l.reason), csvEsc(l.category), csvEsc(l.operator)].join(",")
    ).join("\n");
    downloadBlob("arena-logs.csv", header + rows, "text/csv");
  }

  function csvEsc(s) {
    const t = String(s ?? "");
    if (/[",\n]/.test(t)) return `"${t.replace(/"/g, '""')}"`;
    return t;
  }

  function downloadBlob(filename, content, type) {
    const blob = new Blob([content], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  async function changeDay(newDay) {
    const day = Math.max(1, Number(newDay) || 1);
    const updates = {
      "config/day": day,
      "config/week": Math.ceil(day / 7)
    };
    getPeaksArray().forEach((p) => {
      updates[`peaks/${peakKey(p.id)}/votes`] = 0;
    });
    getDisciplesArray().forEach((d) => {
      updates[`disciples/${d.id}/checked_in_am`] = false;
      updates[`disciples/${d.id}/checked_in_pm`] = false;
      updates[`disciples/${d.id}/voted`] = false;
      updates[`disciples/${d.id}/voted_for`] = "";
    });
    await updatePaths(updates);
  }

  async function doSettleRanks() {
    const ranks = settleRanks(state.disciples || {});
    const updates = {};
    Object.entries(ranks).forEach(([id, rank]) => {
      updates[`disciples/${id}/rank`] = rank;
    });
    await updatePaths(updates);
    alert("段位结算完成");
  }

  async function confirmStudentVote(peakId) {
    const me = findDiscipleByLocal();
    if (!me) {
      alert("请先绑定身份");
      openStudentPickModal();
      return;
    }
    if (!(state.config && state.config.voting_open)) {
      alert("投票已关闭");
      return;
    }
    if (me.voted) {
      alert("你已经投过票了");
      return;
    }
    const peak = findPeak(peakId);
    if (!confirm(`确认投票给 ${peak.icon} ${peak.name}？`)) return;
    await updatePaths({
      [`peaks/${peakKey(peakId)}/votes`]: (peak.votes || 0) + 1,
      [`disciples/${me.id}/voted`]: true,
      [`disciples/${me.id}/voted_for`]: peak.name
    });
    localStorage.setItem(LS_VOTE_KEY, peak.name);
    const host = document.getElementById("fx-host");
    const burst = document.createElement("div");
    burst.className = "toast-levelup";
    burst.innerHTML = `<div class="success-burst">✅</div>`;
    host.appendChild(burst);
    setTimeout(() => burst.remove(), 900);
    renderStudent();
  }

  /* -------------------- 签到端 -------------------- */
  async function nextStudentId() {
    const ids = getDisciplesArray().map((d) => parseInt(d.student_id, 10)).filter((n) => !isNaN(n));
    const max = ids.length ? Math.max(...ids) : 0;
    return String(max + 1).padStart(3, "0");
  }

  function isCodeValid(code) {
    const cfg = state.config || {};
    if (!cfg.checkin_active) return false;
    if (!cfg.checkin_code || cfg.checkin_code !== code) return false;
    if ((cfg.checkin_expires_at || 0) < Date.now()) return false;
    return true;
  }

  async function applyCheckin(discipleId) {
    const d = (state.disciples || {})[discipleId];
    if (!d) return { ok: false, msg: "未找到学员" };
    const session = state.config?.checkin_session || "am";
    const flag = session === "pm" ? "checked_in_pm" : "checked_in_am";
    if (d[flag]) {
      return { ok: false, msg: "已签到 ✓", already: true };
    }
    await updatePaths({ [`disciples/${discipleId}/${flag}`]: true });
    await addScoreToPeak(d.peak, 2, "签到", "日常");
    return { ok: true };
  }

  function renderCheckin() {
    const { code } = getMode();
    const body = document.getElementById("checkin-body");
    if (!FIREBASE_READY && demoMode) {
      // demo: auto-activate code matching URL for convenience
      if (code && state.config && !state.config.checkin_active) {
        // keep showing invalid until teacher generates — unless demo auto
      }
    }

    if (!isCodeValid(code)) {
      // In demo mode allow matching stored code even if expired for UX testing when teacher refreshed
      const softOk = demoMode && state.config?.checkin_code && state.config.checkin_code === code && state.config.checkin_active;
      if (!softOk && !(state.config?.checkin_code === code && state.config?.checkin_active && (state.config.checkin_expires_at || 0) >= Date.now() - 2000)) {
        body.innerHTML = `
          <div style="text-align:center;padding:1rem">
            <div style="font-size:2rem">⛔</div>

    }

    const local = getLocalStudent();
    if (!local) {
      body.innerHTML = `
        <div class="stack">
          <h3 style="color:var(--gold)">🎓 欢迎！请输入你的名字</h3>
          <input id="ci-name" type="text" maxlength="4" placeholder="2-4个中文名" />
          <button type="button" class="primary" id="ci-register">确认并注册</button>
          <div class="gold-line"></div>
          <p class="muted">换设备？从已注册名单中找回</p>
          <button type="button" id="ci-who">你是哪位？</button>
        </div>`;
      document.getElementById("ci-register").onclick = () => registerAndCheckin(code);
      document.getElementById("ci-who").onclick = () => showWhoList(code);
      return;
    }

    const me = findDiscipleByLocal();
    const session = state.config?.checkin_session || "am";
    const flag = session === "pm" ? "checked_in_pm" : "checked_in_am";
    if (me && me[flag]) {
      body.innerHTML = `
        <div style="text-align:center">
          <div style="font-size:1.2rem">👤 ${local.name} · 学号 ${local.student_id}</div>
          <div class="success-burst" style="font-size:3rem;margin:1rem 0">✓</div>
          <div>已签到 ✓ ${fmtTime(Date.now())}</div>
        </div>`;
      return;
    }

    body.innerHTML = `
      <div style="text-align:center" class="stack">
        <div style="font-size:1.2rem">👤 ${local.name} · 学号 ${local.student_id}</div>
        <button type="button" class="primary" id="ci-do" style="padding:1rem;font-size:1.2rem">签到</button>
        <button type="button" class="ghost" id="ci-who">不是我？重新选择</button>
      </div>`;
    document.getElementById("ci-do").onclick = async () => {
      if (!isCodeValid(code) && !(demoMode && state.config?.checkin_code === code && state.config?.checkin_active)) {
        alert("签到码已失效，请重新扫码");
        renderCheckin();
        return;
      }
      const disciple = findDiscipleByLocal();
      if (!disciple) {
        alert("本地身份无效，请重新选择");
        localStorage.removeItem(LS_STUDENT_KEY);
        renderCheckin();
        return;
      }
      const res = await applyCheckin(disciple.id);
      if (res.already) {
        body.innerHTML = `<div style="text-align:center"><div class="success-burst">✓</div><div>${res.msg}</div></div>`;
        return;
      }
      if (!res.ok) { alert(res.msg); return; }
      body.innerHTML = `
        <div style="text-align:center">
          <div class="success-burst">✅</div>
          <div class="badge-fly">学号 ${local.student_id}</div>
          <p style="margin-top:1rem">签到成功 · +2 分已计入山峰</p>
        </div>`;
    };
    document.getElementById("ci-who").onclick = () => {
      localStorage.removeItem(LS_STUDENT_KEY);
      showWhoList(code);
    };
  }

  async function registerAndCheckin(code) {
    const name = (document.getElementById("ci-name").value || "").trim();
    if (!/^[\u4e00-\u9fa5]{2,4}$/.test(name)) {
      alert("请输入2-4个中文名");
      return;
    }
    if (!isCodeValid(code) && !(demoMode && state.config?.checkin_code === code && state.config?.checkin_active)) {
      alert("签到码无效或已过期");
      return;
    }
    // 若同名已存在则绑定该记录
    let existing = getDisciplesArray().find((d) => d.name === name && !d.student_id);
    let discipleId;
    let student_id;
    if (!existing) {
      existing = getDisciplesArray().find((d) => d.name === name);
    }
    if (existing && existing.student_id) {
      // 已有学号，走换设备验证
      alert("该名字已注册，请通过「你是哪位？」验证学号");
      showWhoList(code);
      return;
    }
    if (existing) {
      discipleId = existing.id;
      student_id = await nextStudentId();
      await updatePaths({
        [`disciples/${discipleId}/student_id`]: student_id,
        [`disciples/${discipleId}/first_seen`]: new Date().toISOString(),
        [`disciples/${discipleId}/name`]: name
      });
    } else {
      // 分配到人数最少的山峰
      const peaks = getPeaksArray();
      const counts = {};

  /* -------------------- 毕业回忆 -------------------- */
  const memState = {
    media: [],
    mode: 0, // 0 timeline 1 waterfall 2 flashback
    playing: false,
    speed: 1,
    dayKeys: [],
    dayIndex: 0,
    timer: null,
    bgmOn: true,
    caption: "20天·25个人·1个联盟"
  };

  function renderMemoriesBootstrap() {
    // loader already visible
  }

  function onMemoriesFolder(fileList) {
    const files = Array.from(fileList || []);
    const media = [];
    files.forEach((f) => {
      const lower = f.name.toLowerCase();
      const isImg = /\.(jpg|jpeg|png|gif|webp)$/.test(lower) || (f.type || "").startsWith("image/");
      const isVid = /\.(mp4|mov|webm)$/.test(lower) || (f.type || "").startsWith("video/");
      if (!isImg && !isVid) return;
      media.push({
        file: f,
        url: URL.createObjectURL(f),
        type: isVid ? "video" : "image",
        t: f.lastModified || 0
      });
    });
    media.sort((a, b) => a.t - b.t);
    memState.media = media;
    const days = new Map();
    media.forEach((m) => {
      const d = new Date(m.t);
      const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      if (!days.has(key)) days.set(key, []);
      days.get(key).push(m);
    });
    memState.dayKeys = Array.from(days.keys());
    memState._byDay = days;
    const imgs = media.filter((m) => m.type === "image").length;
    const vids = media.filter((m) => m.type === "video").length;
    let range = "";
    if (media.length) {
      const a = new Date(media[0].t);
      const b = new Date(media[media.length - 1].t);
      range = `${a.getMonth() + 1}月${a.getDate()}日→${b.getMonth() + 1}月${b.getDate()}日`;
    }
    document.getElementById("memories-load-status").textContent =
      `已加载${imgs}张照片+${vids}段视频` + (range ? `·${range}` : "");
    if (media.length) {
      setTimeout(() => startMemoriesPlayback(), 600);
    }
  }

  function startMemoriesPlayback() {
    memState.caption = document.getElementById("memories-caption").value || memState.caption;
    document.getElementById("memories-loader").classList.add("hidden");
    document.getElementById("memories-stage").classList.remove("hidden");
    document.getElementById("memories-controls").classList.remove("hidden");
    memState.playing = true;
    memState.dayIndex = 0;
    setupDefaultBgm();
    runMemoryMode();
  }

  function setupDefaultBgm() {
    const audio = document.getElementById("memories-audio");
    // 轻量内置：使用公开域氛围 freepd 风格占位；用户可上传覆盖
    if (!audio.src) {
      // WebAudio 生成简单柔和 pad 作为后备 BGM（无需外部文件）
      try {
        if (!window.__arenaAudioCtx) {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          window.__arenaAudioCtx = ctx;
          const master = ctx.createGain();
          master.gain.value = 0.04;
          master.connect(ctx.destination);
          const osc = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          osc.type = "sine"; osc2.type = "sine";
          osc.frequency.value = 220; osc2.frequency.value = 277.18;
          const g = ctx.createGain(); g.gain.value = 0.6;
          osc.connect(g); osc2.connect(g); g.connect(master);
          osc.start(); osc2.start();
          window.__arenaPad = { osc, osc2, master, ctx };
        }
      } catch (e) {}
    }
    if (memState.bgmOn) {
      audio.play().catch(() => {});
      if (window.__arenaPad && window.__arenaAudioCtx.state === "suspended") {
        window.__arenaAudioCtx.resume();
      }
    }
  }

  function stopPad() {
    try {
      if (window.__arenaPad) {
        window.__arenaPad.master.gain.value = 0;
      }
    } catch (e) {}
  }

  function clearMemTimer() {
    if (memState.timer) { clearTimeout(memState.timer); memState.timer = null; }
    if (memState.interval) { clearInterval(memState.interval); memState.interval = null; }
  }

  function runMemoryMode() {
    clearMemTimer();
    const stage = document.getElementById("memories-stage");
    const ruler = document.getElementById("memories-ruler");
    stage.innerHTML = "";
    ruler.classList.add("hidden");
    if (!memState.media.length) return;
    if (memState.mode === 0) playTimeline(stage, ruler);
    else if (memState.mode === 1) playWaterfall(stage);
    else playFlashback(stage);
  }

  function playTimeline(stage, ruler) {
    ruler.classList.remove("hidden");
    const track = document.createElement("div");
    track.className = "timeline-track";
    memState.media.forEach((m) => {
      const item = document.createElement("div");
      item.className = "timeline-item";
      if (m.type === "image") {
        const img = document.createElement("img");
        img.src = m.url; img.alt = "";
        item.appendChild(img);
      } else {
        const v = document.createElement("video");
        v.src = m.url; v.muted = true; v.playsInline = true;
        item.appendChild(v);
      }
      track.appendChild(item);
    });
    stage.appendChild(track);
    if (memState.dayKeys.length) {
      ruler.innerHTML = memState.dayKeys.map((k) => `<span>${k.slice(5)}</span>`).join("");
    }
    let idx = 0;
    const items = () => track.querySelectorAll(".timeline-item");
    const stepMs = 2000 / memState.speed;
    const tick = () => {
      if (!memState.playing) return;
      const els = items();
      if (!els.length) return;
      els.forEach((el) => el.classList.remove("active"));
      const cur = els[idx % els.length];
      cur.classList.add("active");
      const mediaEl = cur.querySelector("video");
      if (mediaEl) {
        mediaEl.currentTime = 0;
        mediaEl.play().catch(() => {});
        setTimeout(() => { try { mediaEl.pause(); } catch (e) {} }, Math.min(3000, stepMs + 500));
      }
      const offset = cur.offsetLeft - stage.clientWidth * 0.3;
      track.style.transition = `transform ${0.8 / memState.speed}s ease`;
      track.style.transform = `translateX(${-offset}px)`;
      idx += 1;
      if (idx >= els.length) {
        memState.timer = setTimeout(() => playEnding(stage), stepMs);
      } else {
        memState.timer = setTimeout(tick, stepMs);
      }
    };
    tick();
  }

  function playWaterfall(stage) {
    const layer = document.createElement("div");
    layer.className = "waterfall-layer";
    stage.appendChild(layer);
    const media = memState.media.slice();
    let i = 0;
    const spawn = () => {
      if (!memState.playing || i >= media.length) {
        memState.timer = setTimeout(() => playEnding(stage), 1200 / memState.speed);
        return;
      }
      const m = media[i++];
      const age = i / media.length;
      const size = 80 + age * 160;
      const el = document.createElement("div");
      el.className = "waterfall-item";
      el.style.width = size + "px";
      el.style.height = size + "px";
      el.style.left = Math.random() * 80 + 5 + "%";
      el.style.setProperty("--rot", (Math.random() * 20 - 10) + "deg");
      el.style.filter = age < 0.35 ? "grayscale(.45) brightness(.85)" : "none";
      el.style.animationDuration = (4 + Math.random() * 3) / memState.speed + "s";
      if (m.type === "image") {
        const img = document.createElement("img"); img.src = m.url; el.appendChild(img);
      } else {
        const v = document.createElement("video"); v.src = m.url; v.muted = true; v.autoplay = true; el.appendChild(v);
      }
      layer.appendChild(el);
      setTimeout(() => el.remove(), 7000 / memState.speed);
      memState.timer = setTimeout(spawn, 350 / memState.speed);
    };
    spawn();
  }

  function playFlashback(stage) {
    let i = 0;
    const total = memState.media.length;
    const frame = document.createElement("div");
    frame.className = "flashback-frame";
    stage.appendChild(frame);
    const show = () => {
      if (!memState.playing) return;
      if (i >= total) {
        playEnding(stage);
        return;
      }
      const m = memState.media[i++];
      const isLastDay = memState.dayKeys.length && (() => {
        const lastKey = memState.dayKeys[memState.dayKeys.length - 1];
        const d = new Date(m.t);
        const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        return key === lastKey && i >= total - 1;
      })();
      frame.innerHTML = "";
      frame.style.background = "#000";
      memState.timer = setTimeout(() => {
        if (m.type === "image") {
          const img = document.createElement("img"); img.src = m.url; frame.appendChild(img);
        } else {
          const v = document.createElement("video"); v.src = m.url; v.muted = true; v.autoplay = true; frame.appendChild(v);
        }
        const hold = isLastDay ? 3000 / memState.speed : Math.max(120, 500 - i * 8) / memState.speed;
        memState.timer = setTimeout(() => {
          frame.innerHTML = "";
          memState.timer = setTimeout(show, 80 / memState.speed);
        }, hold);
      }, 80 / memState.speed);
    };
    show();
  }

  function playEnding(stage) {
    clearMemTimer();
    const media = memState.media.filter((m) => m.type === "image");
    const hero = media.length ? media[media.length - 1] : memState.media[memState.media.length - 1];
    stage.innerHTML = "";
    document.getElementById("memories-ruler").classList.add("hidden");

    const gridWrap = document.createElement("div");
    gridWrap.className = "ending-grid";
    const mosaic = document.createElement("div");
    mosaic.className = "mosaic";
    const picks = (media.length ? media : memState.media).slice(-32);
    picks.forEach((m) => {
      const img = document.createElement("img");
      img.src = m.type === "image" ? m.url : "";
      if (m.type !== "image") img.style.background = "#222";
      mosaic.appendChild(img);
    });
    gridWrap.appendChild(mosaic);
    stage.appendChild(gridWrap);

    setTimeout(() => {
      stage.innerHTML = "";
      const heroWrap = document.createElement("div");
      heroWrap.className = "ending-hero";
      const img = document.createElement("img");
      img.src = hero.type === "image" ? hero.url : hero.url;
      heroWrap.appendChild(img);
      const text = document.createElement("div");
      text.className = "ending-text";
      text.textContent = memState.caption;
      heroWrap.appendChild(text);
      stage.appendChild(heroWrap);
      requestAnimationFrame(() => img.classList.add("sharp"));
      setTimeout(() => text.classList.add("show"), 800);
      // BGM 渐弱
      const audio = document.getElementById("memories-audio");
      try {
        if (window.__arenaPad) {
          window.__arenaPad.master.gain.linearRampToValueAtTime(0, window.__arenaAudioCtx.currentTime + 4);
        }
        let vol = audio.volume;
        const fade = setInterval(() => {
          vol = Math.max(0, vol - 0.05);
          audio.volume = vol;
          if (vol <= 0) clearInterval(fade);
        }, 200);
      } catch (e) {}
      memState.playing = false;
      const toggleBtn = document.querySelector('[data-mem="toggle"]');
      if (toggleBtn) toggleBtn.textContent = "⏯️ 播放";
    }, 1600 / memState.speed);
  }

  function memControl(action) {
    if (action === "exit") {
      clearMemTimer();
      stopPad();
      location.href = location.pathname + "?mode=teacher";
      return;
    }
    if (action === "mode") {
      memState.mode = (memState.mode + 1) % 3;
      memState.playing = true;
      runMemoryMode();
      return;
    }
    if (action === "toggle") {
      memState.playing = !memState.playing;
      const btn = document.querySelector('[data-mem="toggle"]');
      if (btn) btn.textContent = memState.playing ? "⏯️ 暂停" : "⏯️ 播放";
      if (memState.playing) runMemoryMode();
      else clearMemTimer();
      return;
    }
    if (action === "speed") {
      memState.speed = memState.speed === 1 ? 2 : memState.speed === 2 ? 3 : 1;
      const btn = document.querySelector('[data-mem="speed"]');
      if (btn) btn.textContent = `⚙️ 速度 ${memState.speed}x`;
      if (memState.playing) runMemoryMode();
      return;
    }
    if (action === "bgm") {
      memState.bgmOn = !memState.bgmOn;
      const audio = document.getElementById("memories-audio");
      if (memState.bgmOn) {
        audio.play().catch(() => {});
        if (window.__arenaPad) window.__arenaPad.master.gain.value = 0.04;
      } else {
        audio.pause();
        stopPad();
      }
      return;
    }
    if (action === "prev" || action === "next") {
      if (!memState.dayKeys.length) return;
      memState.dayIndex = action === "next"
        ? Math.min(memState.dayKeys.length - 1, memState.dayIndex + 1)
        : Math.max(0, memState.dayIndex - 1);
      const key = memState.dayKeys[memState.dayIndex];
      const dayMedia = memState._byDay.get(key) || [];
      // 临时只播当天
      const backup = memState.media;
      memState.media = dayMedia.length ? dayMedia : backup;
      memState.playing = true;
      runMemoryMode();
      setTimeout(() => { memState.media = backup; }, 50);
    }
  }

  function showBootError(err) {
    const box = document.getElementById("boot-error");

    box.textContent = "启动异常：" + (err && err.message ? err.message : String(err));

  async function init() {
    try {
      const { mode } = getMode();
      const m = ["teacher", "student", "checkin", "memories"].includes(mode) ? mode : "teacher";
      showScreen(m);

      if (FIREBASE_READY && typeof firebase !== "undefined") {
        try {
          firebase.initializeApp(FIREBASE_CONFIG);
          db = firebase.database();
          arenaRef = db.ref("arena");
          const snap = await arenaRef.once("value");
          if (!snap.exists()) {
            await arenaRef.set(buildSeedArena());
          }
          arenaRef.on("value", (s) => {
            state = s.val() || buildSeedArena();
            renderAll();
          });
          demoMode = false;
        } catch (err) {
          console.warn("Firebase 初始化失败，进入本地演示模式", err);
          demoMode = true;
          bootDemo();
        }
      } else {
        console.info("未配置 Firebase，使用本地演示模式（localStorage）");
        demoMode = true;
        bootDemo();
      }

      bindTeacherActions();
      bindStudentActions();
      bindMemoriesActions();

      if (m === "memories") {
        renderMemoriesBootstrap();
      } else {
        renderAll();
      }

      if (demoMode) {
        const tip = document.createElement("div");
        tip.style.cssText = "position:fixed;top:8px;left:8px;z-index:99;font-size:12px;color:#d4af37;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:8px";
        tip.textContent = "DEMO · 本地模式（请配置 Firebase）";
        document.body.appendChild(tip);
      }
    } catch (err) {
      console.error(err);
      showBootError(err);
      // 至少展示老师端骨架
      try { showScreen("teacher"); bootDemo(); renderTeacherMain(); } catch (e2) {}
    }
  }

  function bootDemo() {
    state = loadDemo() || buildSeedArena();
    saveDemo();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
  </script>
</body>
</html>
